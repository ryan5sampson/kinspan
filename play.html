function shuffle(a){ a=[...a];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a; }

/* ---- a turn ------------------------------------------------------------
   One of three things: draw `drawCount`, play a card (plus one relative), or
   take a bonus. Drawing is no longer blocked at the hand limit -- you draw and
   then discard back down to it, which makes a full hand a real cost rather
   than a greyed button. */
let mustDiscard=0;     // cards owed to the discard pile before play resumes

function doDraw(){
  previewMove(null);
  if(over||!dealt||!deck.length||mustDiscard) return;
  closeRel(); hidePop();
  const n=Math.min(SET.drawCount, deck.length);
  for(let i=0;i<n;i++) hand.push(deck.shift());
  advanceClock(SET.costDraw);
  endTurn();
  mustDiscard=Math.max(0, hand.length-SET.handLimit);
  render();
}

/* How two cards in hand are tied, or null. Spouse first: a couple is the
   pairing people reach for, and it is the one with its own icon. */
function handLink(a, b){
  const p=byId[a];
  if((p.spouse_ids||[]).includes(b))   return 'spouse';
  if((p.children_ids||[]).includes(b)) return 'child';
  if((p.parent_ids||[]).includes(b))   return 'parent';
  return null;
}

/* The hand laid out as groups: singles, and pairs that play together.
 *
 * The pairing is a DISJOINT matching -- each card belongs to at most one pair.
 * That is what keeps it honest against the one-relative-per-turn rule: Ralph
 * sitting between Deanna and Scott can only leave with one of them, and
 * choosing greedily (spouses first) beats asking the question mid-turn. */
function handGroups(){
  if(!SET.pairPlay) return hand.map(id=>({ids:[id]}));
  const taken=new Set(), out=[];
  for(const id of hand){
    if(taken.has(id)) continue;
    let mate=null, link=null;
    for(const pref of ['spouse','child','parent']){
      mate=hand.find(h=>h!==id && !taken.has(h) && handLink(id,h)===pref);
      if(mate){ link=pref; break; }
    }
    taken.add(id);
    if(mate){ taken.add(mate); out.push({ids:[id,mate], link}); }
    else out.push({ids:[id]});
  }
  return out;
}

/* Playing a group is one turn, however many cards are in it. */
function doPlay(ids){
  previewMove(null);
  if(over||!dealt||mustDiscard) return;
  if(!Array.isArray(ids)) ids=[ids];
  closeRel(); hidePop();
  for(const id of ids){ hand=hand.filter(x=>x!==id); played.push(id); }
  fresh=ids[0];
  setTimeout(()=>{ fresh=null; }, 500);
  // A kin play granted by an ability, or a banked free play, costs no years
  // and is not a turn -- that is the whole value of the ability.
  if(kinFrom && kinIsFree(ids)){ kinFrom=null; render(); return; }
  if(freePlay>0){ freePlay--; endTurn(); render(); return; }
  advanceClock(SET.costPlay);
  endTurn(); render();
}

function endTurn(){ turn++; endCheck(); }

/* Was this play the free relative an Inseparable-style ability granted? */
function kinIsFree(ids){
  const src=byId[kinFrom]; if(!src) return false;
  const kin=new Set([...(src.spouse_ids||[]),...(src.parent_ids||[]),...(src.children_ids||[])]);
  return ids.every(i=>kin.has(i));
}

/* ---- clock ---------------------------------------------------------- */
function clockInit(){
  clockSpan = clockRange(people);
  const back = SET.clockDir==='backward' || SET.clockDir==='backwardforward';
  clock = back ? clockSpan[1] : clockSpan[0];
  clockDir = back ? -1 : 1;
  turned = false; usedAbil.clear(); freePlay=0;
}

/* Years still to walk before the game is over, counting the return leg. */
function yearsLeft(){
  const [a,b]=clockSpan, both = SET.clockDir==='forwardback'||SET.clockDir==='backwardforward';
  const toEnd = clockDir>0 ? b-clock : clock-a;
  return toEnd + (both && !turned ? (b-a) : 0);
}

function advanceClock(years){
  if(!SET.clockOn || !years) return;
  const [a,b]=clockSpan;
  const both = SET.clockDir==='forwardback' || SET.clockDir==='backwardforward';
  let left=years;
  while(left>0){
    const wall = clockDir>0 ? b : a;
    const room = Math.abs(wall-clock);
    if(left < room){ clock += clockDir*left; left=0; break; }
    clock = wall; left -= room;
    if(both && !turned){
      // The turnaround is the whole point of the there-and-back modes: every
      // ability comes back, so the second pass is a real second chance.
      turned=true; clockDir=-clockDir;
      toast(`${clock}. The marker turns for home — every Gift is ready again.`);
      usedAbil.clear();
    } else { over=true; overWhy='The marker walked off the end of the timeline'; return; }
  }
}

/* ---- previewing a move ------------------------------------------------
   Every action costs years, so before you commit to one you should be able to
   see where it puts the marker. Hovering a move draws the band it would spend
   and a dashed line where it would land. */

/* Where `years` of movement would leave the marker, without moving it. Mirrors
   advanceClock's wall-and-turnaround logic; kept separate because that one ends
   the game and toasts, and a preview must do neither. */
function projectClock(years){
  const [a,b]=clockSpan;
  const both = SET.clockDir==='forwardback' || SET.clockDir==='backwardforward';
  let c=clock, d=clockDir, t=turned, left=years, ends=false, turns=false;
  while(left>0){
    const wall = d>0 ? b : a;
    const room = Math.abs(wall-c);
    if(left<room){ c += d*left; break; }
    c = wall; left -= room;
    if(both && !t){ t=true; d=-d; turns=true; }
    else { ends=true; break; }
  }
  return {year:c, turns, ends};
}

function previewMove(years){
  const band=$('#clockband'), gh=$('#clockghost');
  const clear=()=>{ band.className=''; gh.className=''; };
  if(!SET.clockOn || years==null){ clear(); return; }

  let year, ends=false, back=false;
  if(years<0){                       // a Gift handing years back
    back=true;
    year = clockDir>0 ? Math.max(clockSpan[0], clock+years)
                      : Math.min(clockSpan[1], clock-years);
  } else {
    const pr=projectClock(years); year=pr.year; ends=pr.ends;
  }
  if(year===clock){ clear(); return; }

  const x1=X(Math.min(clock,year)), x2=X(Math.max(clock,year));
  band.style.left=x1+'px'; band.style.width=Math.max(1,x2-x1)+'px';
  band.className='on'+(back?' back':'')+(ends?' ends':'');
  gh.style.left=X(year)+'px';
  gh.className='on'+(back?' back':'')+(ends?' ends':'');
  $('#ghostyear').textContent = ends ? 'the end' : year;
}

/* Can this Kin's Gift fire RIGHT NOW, and if not, why not?
 *
 * The general gates -- connected, alive at the marker, not already spent -- are
 * only half of it. Each effect also needs something to act on: a free Connect
 * with an empty hand, or "connect their relative free" with none of their
 * family in hand, is a lit button that does nothing when you press it. Those
 * cases grey out and say what is missing. */
function giftStatus(p){
  const ab = SET.abilityRate>0 ? abilityOf(p) : null;
  if(!ab) return null;
  const no = why => ({ab, ok:false, why});
  if(over) return no('The game is over.');
  if(mustDiscard) return no('Return Kin to the Archive first.');
  if(!played.includes(p.id)) return no('Connect them and you can use it.');
  if(usedAbil.has(p.id)) return no('Already used. It comes back if the marker turns for home.');
  if(SET.clockOn && !aliveAt(p, clock))
    return no(`Only while the marker is between ${startY(p)} and ${p.living?'now':(p.death_year||'?')}.`);

  switch(ab.kind){
    case 'draw':
      if(!deck.length) return no('The Archive is empty — nothing left to pull.');
      break;
    case 'freeplay':
      if(!hand.length) return no('Nothing in your hand to connect for free.');
      break;
    case 'playkin': {
      const kin=new Set([...(p.spouse_ids||[]),...(p.parent_ids||[]),...(p.children_ids||[])]);
      if(!hand.some(h=>kin.has(h)))
        return no('None of their family is in your hand.');
      break;
    }
    case 'time': {
      if(!SET.clockOn) return no('The marker is switched off.');
      const wall = clockDir>0 ? clockSpan[0] : clockSpan[1];
      if(clock===wall) return no('The marker is already as far back as it goes.');
      break;
    }
  }
  return {ab, ok:true, why:''};
}

function readyAbilities(){
  if(SET.abilityRate<=0) return [];
  return played.map(id=>byId[id])
    .map(p=>({p, st:giftStatus(p)}))
    .filter(x=>x.st && x.st.ok)
    .map(x=>({p:x.p, ab:x.st.ab}));
}

function useAbility(id){
  const p=byId[id], st=giftStatus(p);
  if(!st || !st.ok) return;
  const ab=st.ab;
  usedAbil.add(id);
  const n=ab.n||1;
  switch(ab.kind){
    case 'draw':
      for(let i=0;i<n && deck.length;i++) hand.push(deck.shift());
      mustDiscard=Math.max(0, hand.length-SET.handLimit);
      toast(`${ab.name} — pulled ${n} from the Archive, no years spent.`); break;
    case 'time':
      // Free years, and never past the wall you came from.
      clock = clockDir>0 ? Math.max(clockSpan[0], clock-n) : Math.min(clockSpan[1], clock+n);
      toast(`${ab.name} — ${n} years back, to ${clock}.`); break;
    case 'points':
      abilPts += n; toast(`${ab.name} — ${n} Legacy.`); break;
    case 'freeplay':
      freePlay++; toast(`${ab.name} — your next Connect is free.`); break;
    case 'playkin':
      kinFrom=id; toast(`${ab.name} — connect their spouse, parent or child from your hand, free.`); break;
    default:
      toast(`${ab.name}`); break;
  }
  $('#gtip').classList.remove('on');
  render();
}
let abilPts=0, kinFrom=null;

function doDiscard(id){
  if(!mustDiscard) return;
  hand=hand.filter(x=>x!==id); deck.push(id);   // to the bottom, not gone
  mustDiscard--; hidePop(); render();
}
function endCheck(){
  pokerCheck();
  // `turn` has already been advanced to the NEXT turn's number by endTurn, so
  // a limit of 20 means the game is over once it reads 21 -- you get all 20.
  if(!deck.length && !hand.length){
    over=true; overWhy=overWhy||'The Archive and your hand are empty';
  }
}

/* Bonuses not already in play and not still face down in the poker stack. */
function bonusPool(){
  const out=new Set(bonusIds().concat(pending.map(f=>f.id)));
  return draftPool(SET).filter(id=>!out.has(id));
}

/* Spending a turn on a bonus. At the cap this becomes a swap, which is the
   more interesting move anyway: a bonus that has stopped paying is a resource
   rather than dead weight. */
function doTakeBonus(){
  previewMove(null);
  // A turn is one of three things, and the other two are unavailable while the
  // hand is still over the limit.
  if(over || !dealt || !SET.drawBonus || mustDiscard) return;
  const pool=bonusPool(); if(!pool.length) return;
  const full=held().length>=SET.maxBonuses;
  if(full && !SET.swapAtCap) return;
  closeRel();
  takeMode = full ? 'swap' : 'add';
  offer = shuffle(pool).slice(0, Math.max(1, Math.min(SET.deal, pool.length)));
  if(SET.selection==='random'){          // blind games stay blind mid-game too
    commitTake(offer[0]); return;
  }
  pickAll = SET.selection==='all';
  if(pickAll) offer = pool;
  openBonuses();
}
let takeMode=null, swapOut=null;

function commitTake(id){
  if(takeMode==='swap'){
    // Drop the weakest-scoring drafted card unless you picked one to drop.
    const sc=window.scoreBoard(played.map(i=>byId[i]), byId, bonuses);
    const worst=swapOut || held()
      .map(b=>({id:b.id, pts:(sc.bonuses.find(x=>x.id===b.id)||{}).pts||0}))
      .sort((a,b)=>a.pts-b.pts)[0].id;
    bonuses=bonuses.filter(b=>b.id!==worst);
    toast(`${BONUS_BY_ID[worst].name} goes back. ${BONUS_BY_ID[id].name} is yours.`);
  } else {
    toast(`${BONUS_BY_ID[id].name} is yours.`);
  }
  bonuses.push({id});
  takeMode=null; swapOut=null;
  advanceClock(SET.costBonus);
  turn++; endCheck(); render();
}

/* ---------------- layout ----------------
   Units are couples (two adjacent, zero-gap lanes) or singles. Traversal is
   depth-first from the oldest generation, so a child unit is placed straight
   after its parents and never above them. Within a lane, people whose bars do
   not overlap in time share the row.                                        */
function layout(list){
  const inPlay=new Set(list.map(p=>p.id));
  const unitOf={}, units=[], seen=new Set();
  const byGen=[...list].sort((a,b)=>(b.generation??0)-(a.generation??0)||startY(a)-startY(b));
  for(const p of byGen){
    if(seen.has(p.id)) continue;
    const sp=(p.spouse_ids||[]).map(i=>byId[i]).find(s=>s&&inPlay.has(s.id)&&!seen.has(s.id));
    const u=sp?[p,sp]:[p];
    u.forEach(m=>{seen.add(m.id); unitOf[m.id]=u;});
    units.push(u);
  }
  const uid=u=>u[0].id;
  const kidUnits=u=>{
    const out=[], s=new Set();
    for(const m of u) for(const cid of (m.children_ids||[])){
      if(!inPlay.has(cid)) continue;
      const cu=unitOf[cid];
      if(cu && cu!==u && !s.has(uid(cu))){ s.add(uid(cu)); out.push(cu); }
    }
    return out.sort((a,b)=>startY(a[0])-startY(b[0]));
  };
  const hasParent=u=>u.some(m=>(m.parent_ids||[]).some(x=>inPlay.has(x)));

  const lanes=[], place={}, glue=new Set();
  const box=p=>{ const x0=X(startY(p)); return [x0, x0+Math.max(MINW, X(endY(p))-x0)]; };
  const free=(i,x0,x1)=>!(lanes[i]||[]).some(([a,b])=>!(x1<a-XGAP||x0>b+XGAP));

  const assign=(u,minLane)=>{
    const bs=u.map(box);
    const x0=Math.min(...bs.map(b=>b[0])), x1=Math.max(...bs.map(b=>b[1]));
    let i=minLane;
    for(;;i++){
      while(lanes.length<i+u.length) lanes.push([]);
      if(u.every((_,k)=>free(i+k,x0,x1))) break;
    }
    u.forEach((m,k)=>{ lanes[i+k].push(box(m)); place[m.id]={lane:i+k}; });
    if(u.length===2) glue.add(i);
    return i+u.length-1;
  };

  const visited=new Set();
  const visit=(u,minLane)=>{
    if(visited.has(uid(u))) return;
    visited.add(uid(u));
    const last=assign(u,minLane);
    for(const cu of kidUnits(u)) visit(cu,last+1);
  };
  units.filter(u=>!hasParent(u)).forEach(u=>visit(u,0));
  units.forEach(u=>visit(u,0));

  const laneY=[]; let y=TOP;
  for(let i=0;i<lanes.length;i++){ laneY[i]=y; y+=LANE_H+(glue.has(i)?COUPLE_GAP:LANE_GAP); }
  Object.values(place).forEach(v=>v.y=laneY[v.lane]);
  return {place, height:y+16};
}

/* Write innerHTML only when the markup actually differs. Every render used to
   rewrite the sidebar and the hand wholesale, which is what the flicker was:
   the element under the cursor was destroyed and rebuilt, firing mouseleave →
   render → mouseenter → render in a loop, and killing every CSS transition
   mid-flight because the node they were running on no longer existed. */
function setHTML(el, html){
  if(el.dataset.sig===html) return false;
  el.dataset.sig=html; el.innerHTML=html; return true;
}

/* ---------------- render ---------------- */
/* `ghost` is what hovering a Kin in hand previews. It is a LIST, because a
   married pair or a parent and child connect together -- previewing only the
   one under the cursor showed half of what the click would actually do. */
function render(ghost){
  const ghosts = ghost ? (Array.isArray(ghost)?ghost:[ghost]) : [];
  const ghostId = ghosts[0] || null;
  const list=(ghosts.length?played.concat(ghosts):played).map(id=>byId[id]);
  $('#turn').textContent = turn;
  $('#deckn').textContent=deck.length;
  const sc=window.scoreBoard(played.map(id=>byId[id]), byId, bonuses);
  if(abilPts){ sc.lines.push({label:'Gifts you used', pts:abilPts,
    detail:'Legacy handed to you by your own Kin'}); sc.total+=abilPts; }
  // In 'brutal' the score exists and is computed exactly as always -- it is
  // simply not shown until the game ends. Nothing about scoring changes.
  const seeScore = showsScore(SET) || over;
  if(seeScore) tickScore(sc.total);
  else { shownScore=null; $('#ltot').textContent='—'; }
  // The button that opens the panel carries the number only while the panel is
  // not showing it. Keyed off whether the panel is actually open rather than
  // the viewport width, so closing it on a desktop puts the number back too.
  $('#score').textContent = $('#side').classList.contains('on')
    ? 'Legacy' : `Legacy ${seeScore ? sc.total : '—'}`;
  const blHTML = sc.bonuses.length ? sc.bonuses.map(b=>`
      <div class="ab ${b.baseline?'base':(seeScore&&b.pts?'scoring':'')}
           ${!ghostId&&lastPts[b.id]===undefined?'fresh':''}
           ${!ghostId&&lastPts[b.id]!==undefined&&lastPts[b.id]!==b.pts?'bumped':''}">
        <div class="t"><span>${esc(b.name)}${b.baseline?'<i class="tag b">default</i>':''}${
          b.mult>1?`<i class="tag x">×${b.mult}</i>`:''}</span>${
          seeScore?`<b>+${b.pts}</b>`:'<b class="hid">?</b>'}</div>
        <div class="b">${esc(b.blurb)}</div>
        ${seeScore&&b.detail?`<div class="d">${esc(b.detail)}</div>`:''}
      </div>`).join('')
    : '<div class="msg">You have no Legacy cards yet, so every Kin is worth one Legacy. '
      +'Tap <b>Legacy cards</b> to choose some.</div>';
  setHTML($('#bl'), blHTML + (pending.length
    ? `<div class="msg" style="margin-top:6px">${pending.length} still face down. The next
        turns over on turn ${pending[0].turn}${pending.length===1&&pending[0].mult>1
          ? ', and it is worth <b>double</b>':''}.</div>` : ''));

  setHTML($('#sl'), !seeScore
    ? '<div class="msg">Hidden this game. You will see it all when the game ends.</div>'
    : sc.lines.length ? sc.lines.map(l=>`
      <div class="sl ${l.big?'big':''}"><div class="t"><span>${esc(l.label)}</span><b>+${l.pts}</b></div>
      ${l.detail?`<div class="d">${esc(l.detail)}</div>`:''}</div>`).join('')
    : '<div class="msg">Connect a Kin to start earning.</div>');

  // Gifts live on the person now, not in a list over here -- see showPop().
  setHTML($('#clockbox'), !SET.clockOn ? '' : `
    <div class="clockbar"><b>${clock}</b>
      <span>${clockDir>0?'moving forward':'moving back'} ·
        ${yearsLeft()} year${yearsLeft()===1?'':'s'} left${turned?' · on the way home':''}</span>
      ${readyAbilities().length?`<span class="gifts">${readyAbilities().length}
        Gift${readyAbilities().length===1?'':'s'} ready — look for a lit ✦</span>`:''}</div>`);

  // Remember what each bonus was worth so the NEXT render knows what moved.
  // Ghost previews are hypothetical, so they must not update the baseline or
  // every hover would leave the sidebar flashing at real values it never had.
  if(!ghostId) for(const b of sc.bonuses) lastPts[b.id]=b.pts;
  if(!ghostId) renderHand(sc.total);
  if(!list.length){
    nodes.forEach(el=>el.remove()); nodes.clear();
    $('#cards').innerHTML='<div class="empty">Nobody on the timeline yet. Connect a Kin from your hand.</div>';
    $('#links').innerHTML=''; $('#axis').innerHTML=''; $('#axis').dataset.w='';
    $('#inner').style.height='auto'; return;
  }
  if($('#cards').firstElementChild && $('#cards').firstElementChild.className==='empty')
    $('#cards').innerHTML='';
  paint(list, ghosts);
}

/* Roll the total up to its new value instead of swapping the number. Small
   thing, but a score that counts is the difference between a readout and a
   game telling you it just gave you something. */
let shownScore=null, scoreTimer=0, lastPts={};
function tickScore(target){
  const el=$('#ltot');
  // rAF does not run in a hidden tab, so a tween started there would leave the
  // old number frozen on screen until something else forced a paint. Snap.
  if(shownScore===null || Math.abs(target-shownScore)<=1 || prefersStill() || document.hidden){
    shownScore=target; el.textContent=target; return;
  }
  const box=$('#legacytotal');
  if(target!==shownScore)
    box.classList.remove('bump'), void box.offsetWidth, box.classList.add('bump');
  cancelAnimationFrame(scoreTimer);
  // rAF, not setInterval: a timer keeps firing (throttled to a crawl) while the
  // tab is hidden and the count arrives in visible lurches on return. rAF just
  // pauses, and the guard below snaps to the right number when it resumes.
  const from=shownScore, span=target-from, t0=performance.now();
  const ms=Math.min(700, 120+Math.abs(span)*26);
  const step=()=>{
    const k=Math.min(1,(performance.now()-t0)/ms);
    el.textContent=Math.round(from + span*(1-Math.pow(1-k,3)));
    if(k<1) scoreTimer=requestAnimationFrame(step); else shownScore=target;
  };
  scoreTimer=requestAnimationFrame(step);
}
const prefersStill=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Paint the board. `ghosts` are the Kin being hovered in hand: they are laid out
   as if played, so the preview shows the REAL consequence -- including the
   other cards shifting to make room. Nodes are keyed by id and mutated rather
   than rebuilt, so those shifts animate instead of jumping. */
const nodes = new Map();
function paint(list, ghosts){
  ghosts = ghosts || [];
  const isGhost = id => ghosts.includes(id);
  const cards=$('#cards'), axis=$('#axis');
  const {place,height}=layout(list);
  const W=X(span[1])+10;
  $('#inner').style.width=W+'px'; $('#inner').style.height=height+'px';

  if(axis.dataset.w!==String(W)){
    let a='';
    for(let y=span[0]; y<=span[1]; y+=10)
      a+=`<div class="grid" style="left:${X(y)}px"></div><div class="tick" style="left:${X(y)}px">${y}</div>`;
    axis.innerHTML=a; axis.style.width=W+'px'; axis.dataset.w=String(W);
  }

  const want=new Set(list.map(p=>p.id));
  for(const [id,el] of nodes) if(!want.has(id)){ el.remove(); nodes.delete(id); }

  for(const p of list){
    let el=nodes.get(p.id);
    const isNew=!el;
    if(!el){
      el=document.createElement('div');
      el.dataset.id=p.id;
      el.onpointerdown=e=>{ if(!el.classList.contains('ghost')) beginDrag(e, p.id); };
      el.onclick=()=>{ if(dragMoved){ dragMoved=false; return; }
        if(el.classList.contains('ghost')) return;
        // No hover on a touch screen, so the first tap does what the hover did
        // and only a second tap on the SAME card opens the full sheet.
        if(TOUCH && inspecting!==p.id){ inspecting=p.id; spotlight(p.id); showPop(p.id,false); return; }
        inspecting=null; openCard(byId[p.id]); };
      el.onmouseenter=()=>{ if(TOUCH||drag||el.classList.contains('ghost')) return;
        spotlight(p.id); showPop(p.id, false); };
      el.onmouseleave=()=>{ if(TOUCH||drag||el.classList.contains('ghost')) return;
        spotlight(null); hidePop(true); };
      cards.appendChild(el); nodes.set(p.id, el);
    }
    const endCls=p.living?'living':(p.death_year?'':'unknownend');
    const pips='◆'.repeat((p.abilities||[]).length);
    const lit=SET.clockOn && aliveAt(p, clock);
    el.className=`card ${sideOf(p)} ${endCls} ${isGhost(p.id)?'ghost':''} `
                +`${p.id===fresh?'fresh':''} ${isNew&&!isGhost(p.id)?'landing':''} `
                +`${lit?'alive':''}`;
    /* The marriage heart sits in the seam the two bars share, at the wedding
       year -- which on a narrow screen lands in the middle of a name and its
       halo erases the letters underneath. Truncate the name before it instead:
       the ellipsis is honest, a name with a hole punched in it is not. */
    // Their Gift, at the end of their bar. Built here rather than in the
    // details panel so it is on the person, in a place you can click.
    const gst = isGhost(p.id) ? null : giftStatus(p);
    const gab = gst ? gst.ab : (SET.abilityRate>0 ? abilityOf(p) : null);
    const gState = !gab ? null : !gst ? 'off'
      : gst.ok ? 'live' : (usedAbil.has(p.id) ? 'spent' : 'off');

    let nmCap='';
    for(const m of (p.marriages||[])){
      const seam=seamOf(p, m, place); if(seam==null) continue;
      const room=X(m.year) - X(startY(p)) - 15;
      if(room > 24) nmCap=`;max-width:${Math.round(room)}px`;
    }
    el.innerHTML=`<span class="nm ${p.sex==='M'?'m':p.sex==='F'?'f':''}" `
      +`style="min-width:0${nmCap}">${esc(p.name)}</span>`
      +(pips?`<span class="pips">${pips}</span>`:'')
      +eventMarks(p, place)
      +(gab?`<button class="gbtn ${gState}" data-gift="${p.id}"
             aria-label="${esc(gab.name)}">✦</button>`:'');
    el.style.left=X(startY(p))+'px';
    el.style.top=place[p.id].y+'px';
    el.style.width=Math.max(MINW,X(endY(p))-X(startY(p)))+'px';
    // Nodes are reused now, so inline opacity from a previous spotlight would
    // otherwise persist after the hover ends.
    el.style.opacity='';
    // One-shot classes: leaving them on would replay the drop every time the
    // board re-renders for an unrelated reason.
    if(isNew) setTimeout(()=>el.classList.remove('landing'), 460);

    const gb=el.querySelector('.gbtn');
    if(gb) wireGift(gb, p, gab, gState, gst);
  }
  drawLinks(list, place, W, height);
  const cl=$('#clockline');
  cl.style.display = SET.clockOn ? 'block' : 'none';
  if(SET.clockOn){ cl.style.left=X(clock)+'px'; $('#clockyear').textContent=clock; }
  if(ghosts.length) spotlight(ghosts[0], true);
  else if(fresh) revealCard(fresh);
}

const HEART_D='M12 21s-7.5-4.7-7.5-10.4A4.6 4.6 0 0 1 12 7.6a4.6 4.6 0 0 1 7.5 3C19.5 16.3 12 21 12 21z';
const FIGURE_D='<circle cx="12" cy="5.5" r="3.4"/><path d="M12 9.5v7M12 16.5l-4 5M12 16.5l4 5M7 12h10"/>';
const HEART='<svg width="11" height="11" viewBox="0 0 24 24"><path d="'+HEART_D+'"/></svg>';
const FIGURE='<svg width="9" height="11" viewBox="0 0 24 24">'+FIGURE_D+'</svg>';

/* Life events drawn on the bar itself: a heart at each marriage year, a small
   figure at each child's birth year. Skipped when they'd fall outside the bar.
   Also skipped when the OTHER party is on the board, because drawLinks then
   draws that same icon on the connection between them -- one heart for the
   couple rather than one on each bar, and one figure riding the parent-child
   line rather than a figure the line runs straight through. `place` is how we
   know who else is down; without it (no board context) every mark is drawn. */
function eventMarks(p, place){
  const x0=X(startY(p)), w=Math.max(MINW, X(endY(p))-x0);
  const out=[];
  const at=(year, cls, svg, title)=>{
    if(!year) return;
    const off=X(year)-x0;
    if(off<6||off>w-6) return;                 // would hang off the bar
    out.push(`<span class="evt ${cls}" style="left:${off}px" title="${esc(title)}">${svg}</span>`);
  };
  for(const m of (p.marriages||[])){
    if(place && seamOf(p, m, place)!=null) continue;   // heart lives on the seam
    at(m.year,'wed',HEART,`Married ${m.year}${m.spouse_name?' — '+m.spouse_name:''}`);
  }
  for(const cid of (p.children_ids||[])){
    const c=byId[cid];
    if(place && place[cid]) continue;                  // figure rides the line
    if(c && c.birth_year) at(c.birth_year,'kid',FIGURE,`${c.name} born ${c.birth_year}`);
  }
  return out.join('');
}

/* The y of the seam two married bars share, or null if this couple doesn't get
   a heart there -- spouse not on the board, no marriage year to place it at, or
   the two ended up in non-adjacent lanes so there is no seam to sit on. Both
   eventMarks and drawLinks ask this, so exactly one heart is drawn either way. */
function seamOf(p, mar, place){
  const sp=byId[mar.spouse_id];
  if(!sp || !mar.year || !place[p.id] || !place[sp.id]) return null;
  if(Math.abs(place[p.id].lane-place[sp.id].lane)!==1) return null;
  return Math.max(place[p.id].y, place[sp.id].y);
}

function drawLinks(list, place, W, H){
  const svg=$('#links');
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let g='';
  for(const child of list){
    const bx=X(startY(child)), cy=place[child.id].y;
    const tint=sideOf(child)==='mat'?'var(--mat)':sideOf(child)==='self'?'var(--self)':'var(--pat)';
    const ttl=`${esc(child.name)} born ${startY(child)}`;
    let near=null;                       // shortest link -- where the badge goes
    for(const pid of (child.parent_ids||[])){
      if(!place[pid]) continue;
      const py=place[pid].y;
      const from=py<cy?py+LANE_H:py, to=py<cy?cy:cy+LANE_H, mid=(from+to)/2;
      g+=`<path class="kin" data-a="${pid}" data-b="${child.id}"
            d="M ${bx} ${from} C ${bx} ${mid}, ${bx} ${mid}, ${bx} ${to}"
            stroke="${tint}" stroke-width="2" fill="none" opacity=".85"/>`;
      if(!near || Math.abs(to-from)<near.len)
        near={pid, len:Math.abs(to-from), corner:(py<cy?cy:cy+LANE_H)};
    }
    // ONE badge per birth, not one per parent: with both parents on the board a
    // child has two lines, and a bubble on each stacked two figures on top of
    // each other for what is a single event. It rides the shorter line -- the
    // nearer parent.
    //
    // It sits on the CHILD'S OWN CORNER rather than halfway up that line. Mid-
    // line put it squarely over whichever bar was above, which is somebody's
    // name; on the corner it straddles the child's own leading edge, where the
    // card's padding already leaves the name clear.
    if(near){
      const d=`data-a="${near.pid}" data-b="${child.id}"`;
      const cx=bx-1, ky=near.corner;
      g+=`<circle class="kin bub" ${d} cx="${cx}" cy="${ky}" r="8"
            fill="var(--panel)" stroke="${tint}" stroke-width="1.5"><title>${ttl}</title></circle>
          <svg class="kin fig" ${d} x="${cx-4.5}" y="${ky-5.5}" width="9" height="11"
            viewBox="0 0 24 24" fill="none" stroke="${tint}" stroke-width="2.6"
            stroke-linecap="round">${FIGURE_D}<title>${ttl}</title></svg>`;
    }
  }
  const done=new Set();
  for(const p of list) for(const mar of (p.marriages||[])){
    const sp=byId[mar.spouse_id];
    if(!sp||!place[sp.id]||!mar.year) continue;
    const key=[p.id,sp.id].sort().join('|'); if(done.has(key)) continue; done.add(key);
    const seam=seamOf(p, mar, place); if(seam==null) continue;
    const mx=X(mar.year);
    g+=`<g class="mar" data-a="${p.id}" data-b="${sp.id}">
          <circle cx="${mx}" cy="${seam}" r="8.4" fill="var(--panel)"
            stroke="var(--wed)" stroke-width="1.4"/>
          <svg x="${mx-6}" y="${seam-7.1}" width="12" height="12" viewBox="0 0 24 24">
            <path d="${HEART_D}" fill="var(--wed)"/></svg>
          <title>${esc(p.name)} &amp; ${esc(sp.name)} — married ${mar.year}</title></g>`;
  }
  svg.innerHTML=g;
}

/* ---- drag one card onto another to ask how they are related ---------- */
let drag=null, dragMoved=false;

function innerXY(e){
  const r=$('#inner').getBoundingClientRect();
  return [e.clientX-r.left, e.clientY-r.top];
}
function cardCentre(id){
  const el=nodes.get(id); if(!el) return null;
  return [parseFloat(el.style.left)+el.offsetWidth/2, parseFloat(el.style.top)+LANE_H/2];
}

/* A finger has to do two incompatible things on this screen: scroll the
   timeline, and drag one card onto another. So touch waits -- press and hold
   for LONGPRESS and the drag begins; move before that and it is a scroll and
   we never take it. A mouse has a dedicated button, so it starts immediately. */
const LONGPRESS=340;
let pressTimer=null, pressStart=null;

function beginDrag(e, id){
  if(e.pointerType==='mouse' && e.button!==0) return;
  if(e.pointerType==='mouse'){ e.preventDefault(); return startDrag(e, id); }

  pressStart=[e.clientX, e.clientY];
  clearTimeout(pressTimer);
  pressTimer=setTimeout(()=>{
    pressTimer=null;
    startDrag(e, id);
    nodes.get(id)?.classList.add('armed');
    if(navigator.vibrate) navigator.vibrate(12);
  }, LONGPRESS);
  addEventListener('pointermove', pressWatch);
  addEventListener('pointerup', pressCancel, {once:true});
  addEventListener('pointercancel', pressCancel, {once:true});
}
/* Any real movement before the timer means they meant to scroll. */
function pressWatch(e){
  if(!pressStart||!pressTimer) return;
  if(Math.hypot(e.clientX-pressStart[0], e.clientY-pressStart[1])>10) pressCancel();
}
function pressCancel(){
  clearTimeout(pressTimer); pressTimer=null; pressStart=null;
  removeEventListener('pointermove', pressWatch);
}

function startDrag(e, id){
  pressCancel();
  drag={from:id, to:null}; dragMoved=false;
  document.body.classList.add('dragging');
  nodes.get(id)?.classList.add('dragsrc');
  hidePop();
  addEventListener('pointermove', onDragMove);
  addEventListener('pointerup', onDragEnd, {once:true});
  addEventListener('pointercancel', onDragEnd, {once:true});
}

function onDragMove(e){
  if(!drag) return;
  e.preventDefault();
  dragMoved=true;
  const [x,y]=innerXY(e);
  const from=cardCentre(drag.from);
  const over=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card');
  const tgt=over && over.dataset.id!==drag.from ? over.dataset.id : null;
  if(tgt!==drag.to){
    if(drag.to) nodes.get(drag.to)?.classList.remove('dragtgt');
    drag.to=tgt;
    if(tgt) nodes.get(tgt)?.classList.add('dragtgt');
  }
  const end = tgt ? cardCentre(tgt) : [x,y];
  $('#drag').innerHTML = from ? `
    <path d="M ${from[0]} ${from[1]} L ${end[0]} ${end[1]}" stroke="var(--gold)"
      stroke-width="2.4" stroke-dasharray="6 4" fill="none"/>
    <circle cx="${end[0]}" cy="${end[1]}" r="4" fill="var(--gold)"/>` : '';
}

async function onDragEnd(e){
  removeEventListener('pointermove', onDragMove);
  document.body.classList.remove('dragging');
  $('#drag').innerHTML='';
  const d=drag; drag=null;
  if(!d) return;
  nodes.get(d.from)?.classList.remove('dragsrc','armed');
  if(d.to) nodes.get(d.to)?.classList.remove('dragtgt');
  if(!d.to || !dragMoved){ setTimeout(()=>dragMoved=false, 0); return; }
  await showRelation(d.from, d.to, e);
}

async function showRelation(a, b, e){
  /* Computed here now, not by the server. This used to POST /api/relate, which
     was the one route importing ged4py, so a server started without its venv
     500'd on exactly this and nothing else -- the only symptom was a drag that
     did nothing. Local means it cannot fail that way, but keep saying so when
     it does fail: a silent return is what made that bug so hard to see. */
  let r;
  try{
    r=FAMILY.relate(fam, a, b);
  }catch(err){ toast('Could not trace the line — ' + (err.message||err)); return; }
  if(!r || !r.ok){ toast((r&&r.error) || 'Could not trace the line.'); return; }

  const onBoard=new Set(played);
  const mid=r.path.slice(1,-1);
  const missing=mid.filter(p=>!onBoard.has(p.id));
  const sexCls=p=>p.sex==='M'?'m':p.sex==='F'?'f':'';
  const LINK={parent:'parent of',child:'child of',spouse:'married to'};

  let headline, sub;
  if(r.blood){
    headline=`<em>${esc(r.b.name)}</em> is ${esc(r.a.name)}'s <em>${esc(r.relationship)}</em>`;
    sub=`${r.side?r.side+' side · ':''}${r.steps} step${r.steps===1?'':'s'} apart`;
  }else if(r.connected){
    headline=`Joined by marriage, not by blood`;
    sub=`${esc(r.a.name)} and ${esc(r.b.name)} — ${r.steps} steps apart`;
  }else{
    headline=`No line between them`;
    sub=`Nothing in your family joins these two.`;
  }

  const chain=r.path.map((p,i)=>
    (i?`<span class="lk">${LINK[p.link]||''}</span>`:'')+
    `<span class="pn ${sexCls(p)} ${onBoard.has(p.id)?'':'off'}"
       title="${onBoard.has(p.id)?'on the timeline':'a Missing Link'}">${esc(p.name)}</span>`
  ).join('');

  let need='';
  if(missing.length && missing.length<=2){
    need=`<div class="need">Missing Link: connect
      <b>${missing.map(m=>esc(m.name)).join('</b> and <b>')}</b> and the line is whole.${
      missing.some(m=>!m.playable)
        ? ' <br>One of them has no birth year yet — add it in the Archive first.' : ''}</div>`;
  }else if(missing.length>2){
    need=`<div class="need">${missing.length} Missing Links stand between them.</div>`;
  }

  $('#rel').innerHTML=`<span class="x" onclick="closeRel()">✕</span>
    <div class="hd">The line between them</div>
    <div class="big">${headline}</div>
    <div class="sub">${sub}</div>
    ${r.path.length?`<div class="chain">${chain}</div>`:''}
    ${need}`;
  const R=$('#rel'); R.classList.add('on');
  const w=R.offsetWidth, h=R.offsetHeight;
  R.style.left=Math.max(8,Math.min((e?e.clientX:200)-w/2, innerWidth-w-8))+'px';
  R.style.top=Math.max(8,Math.min((e?e.clientY:200)+16, innerHeight-h-8))+'px';

  // trace the route on the board
  document.querySelectorAll('#cards .card').forEach(c=>{
    const on=r.path.some(p=>p.id===c.dataset.id);
    c.classList.toggle('onpath', on);
    c.style.opacity = on ? '1' : '.35';
  });
}

function closeRel(){
  $('#rel').classList.remove('on');
  document.querySelectorAll('#cards .card').forEach(c=>{
    c.classList.remove('onpath'); c.style.opacity='';
  });
}

function spotlight(id, force){
  document.querySelectorAll('#links .kin, #links .mar').forEach(n=>{
    n.classList.remove('dim','hot');
    if(!id) return;
    n.classList.add((n.dataset.a===id||n.dataset.b===id)?'hot':'dim');
  });
  document.querySelectorAll('#cards .card').forEach(c=>{
    c.style.opacity=(!id||c.dataset.id===id||isKin(id,c.dataset.id))?'1':(force?'.55':'.4');
  });
}
function isKin(a,b){ const A=byId[a]; if(!A) return false;
  return (A.parent_ids||[]).includes(b)||(A.children_ids||[]).includes(b)||(A.spouse_ids||[]).includes(b); }

/* What would this card be worth right now? Shown on the hand card. */
/* What playing this whole group would add. A pair shows the pair's value on
   both its cards, because that is what the click actually does. */
function gainOfGroup(ids){
  const now=window.scoreBoard(played.map(x=>byId[x]),byId,bonuses).total;
  const next=window.scoreBoard(played.concat(ids).map(x=>byId[x]),byId,bonuses).total;
  return next-now;
}
function gainOf(id){
  const now=window.scoreBoard(played.map(x=>byId[x]),byId,bonuses).total;
  const next=window.scoreBoard(played.concat(id).map(x=>byId[x]),byId,bonuses).total;
  return next-now;
}

/* Line-by-line difference the card would make, so the number is explainable. */
function gainBreakdown(ids){
  if(!Array.isArray(ids)) ids=[ids];
  const a=window.scoreBoard(played.map(x=>byId[x]),byId,bonuses);
  const b=window.scoreBoard(played.concat(ids).map(x=>byId[x]),byId,bonuses);
  const was={}; a.lines.forEach(l=>was[l.label]=l.pts);
  return b.lines.map(l=>({label:l.label, d:l.pts-(was[l.label]||0)}))
                .filter(x=>x.d>0);
}

/* Which cards already on the table it would touch. */
function connectionsOf(p){
  const on=new Set(played), out=[];
  for(const sid of (p.spouse_ids||[])) if(on.has(sid))
    out.push({how:'spouse', who:byId[sid].name});
  for(const pid of (p.parent_ids||[])) if(on.has(pid))
    out.push({how:'parent', who:byId[pid].name});
  for(const cid of (p.children_ids||[])) if(on.has(cid))
    out.push({how:'child', who:byId[cid].name});
  return out;
}

/* One details panel for both the hand and the board. `inHand` adds the things
   that only matter before a card is down -- what it would score, and where it
   would land -- and the board version drops them. */
function showPop(id, inHand, group){
  group = group && group.length ? group : [id];
  const p=byId[id], el=$('#insp');
  const conn=connectionsOf(p);
  // `traits` already carries Children when a real count exists, so anything
  // added here has to check the key or the row appears twice.
  const rows=(p.traits||[]).slice();
  const hasKey=k=>rows.some(t=>t.k===k);
  if(p.burial_place && !hasKey('Buried'))
    rows.push({k:'Buried', v:p.burial_place.split(',').slice(0,2).join(',')});
  if(p.child_count!=null && !hasKey('Children'))
    rows.push({k:'Children', v:String(p.child_count)});
  const facts=rows.map(t=>
    `<span>${esc(t.k)}</span><span>${esc(t.v)}</span>`).join('');

  /* ---- their Gift, right here on them ----------------------------------
     A Gift belongs to a person, so it is offered where you are already looking
     at that person rather than in a list on the other side of the screen. It
     always shows if they have one; the button only appears when it can fire. */
  let gift='';
  const gs = giftStatus(p);
  const ab = gs ? gs.ab : null;
  if(ab){
    const usable = gs.ok, spent = usedAbil.has(id), why = gs.why;
    gift=`<div class="gift ${usable?'live':''} ${spent?'spent':''}">
      <div class="gn">✦ ${esc(ab.name)}</div>
      <div class="ge">${esc(ab.effect)}</div>
      ${ab.why||ab.story?`<div class="gw">${esc(ab.why||ab.story)}</div>`:''}
      <div class="gm">${usable
        ? 'Ready — the ✦ at the end of their life is lit.'
        : esc(why)}</div>
    </div>`;
  }

  let tail='';
  if(inHand){
    tail = showsPreview(SET)
      ? `<div class="gainbig"><span>Connect ${group.length>1?'them both':'them'} now</span>
           <b>+${gainOfGroup(group)} Legacy</b></div>`
        + (()=>{ const br=gainBreakdown(group);
            return br.length?`<div class="hintrow">${br.map(x=>`${esc(x.label)} +${x.d}`).join(' · ')}</div>`:''; })()
      : `<div class="gainbig blind"><span>Connect ${group.length>1?'them both':'them'} now</span>
           <span>you work it out</span></div>`;
    tail += `<div class="hintrow">The dashed outline${group.length>1?'s show':' shows'} where
      ${group.length>1?'they':'they'} would sit.</div>`;
  }
  el.innerHTML=`
    <div class="who">
      <div class="rel">${esc(p.relationship_to_root||'')}${p.relationship_side?' · '+p.relationship_side:''}</div>
      <h4 class="${p.sex==='M'?'m':p.sex==='F'?'f':''}">${esc(p.name)}</h4>
      <div class="life">${startY(p)}–${p.living?'living':(p.death_year||'?')}${
        p.age_at_death?` · ${p.age_at_death} years`:''} · ${esc(tierOf(p))}</div>
      ${p.story?`<div class="story">${esc(p.story)}</div>`:''}
    </div>
    <div class="facts">${facts}</div>
    <div class="extra">
      ${gift}
      <div class="conn">${conn.length
        ? (inHand?'Would join ':'Joined to ')
          + conn.map(c=>`<b>${esc(c.who)}</b> <span>(${c.how})</span>`).join(', ')
        : (inHand?'None of their family is on the timeline yet — they would stand alone.'
                :'None of their family is on the timeline with them.')}</div>
      ${tail}
      ${TOUCH?`<button id="inspmore" data-id="${id}">See everything about them</button>`:''}
    </div>`;
  el.style.setProperty('--accent', sideOf(p)==='mat'?'var(--mat)'
    :sideOf(p)==='self'?'var(--self)':'var(--pat)');
  clearTimeout(popTimer);
  el.classList.add('on');
  const more=$('#inspmore');
  if(more) more.onclick=()=>{ inspecting=null; hidePop(); openCard(byId[id]); };
  const act=el.querySelector('.act');
  if(act){ act.onmouseenter=()=>clearTimeout(popTimer);
           act.onmouseleave=()=>hidePop(true); }
}
let popTimer=null;
/* The Gift button. Hovering it explains the Gift without opening anything
   else; clicking a lit one fires it. It sits inside the card, so every handler
   has to stop the event reaching the card's own click and drag handlers --
   otherwise using a Gift would also open that Kin's full sheet. */
function wireGift(btn, p, ab, state, st){
  const show=()=>{
    const r=btn.getBoundingClientRect(), t=$('#gtip');
    t.innerHTML=`<div class="n">✦ ${esc(ab.name)}</div>
      <div class="e">${esc(ab.effect)}</div>
      ${ab.why||ab.story?`<div class="w">${esc(ab.why||ab.story)}</div>`:''}
      ${state==='live' ? '<div class="go">Click to use it</div>'
        : `<div class="m">${esc((st&&st.why) || 'Not right now.')}</div>`}`;
    t.classList.add('on');
    const w=t.offsetWidth, h=t.offsetHeight;
    // Clamp to the window only when the window has a size to clamp to -- a
    // zero-width read would otherwise fling the tip to the left edge.
    let x=r.left+r.width/2-w/2;
    if(innerWidth>0) x=Math.max(8, Math.min(x, innerWidth-w-8));
    t.style.left=x+'px';
    t.style.top=(r.top-h-9 < 8 ? r.bottom+9 : r.top-h-9)+'px';
  };
  const hide=()=>$('#gtip').classList.remove('on');
  btn.onmouseenter=()=>{ if(TOUCH) return;
    show();
    if(state==='live' && ab.kind==='time') previewMove(-(ab.n||0)); };
  btn.onmouseleave=()=>{ if(TOUCH) return; hide(); previewMove(null); };
  btn.onpointerdown=e=>e.stopPropagation();     // never starts a drag
  btn.onclick=e=>{
    e.stopPropagation();
    if(state!=='live'){ if(TOUCH) { show(); setTimeout(hide, 2600); } return; }
    // On a touch screen the first tap explains it and the second uses it, the
    // same two-tap rule the rest of the board follows.
    if(TOUCH && giftTapped!==p.id){ giftTapped=p.id; show(); return; }
    giftTapped=null; hide(); useAbility(p.id);
  };
}
let giftTapped=null;

function hidePop(soft){
  clearTimeout(popTimer);
  const go=()=>$('#insp').classList.remove('on');
  if(soft) popTimer=setTimeout(go, 220); else go();
}

/* Scroll the timeline so a card you just played is actually visible. The board
   is wider than any screen and much wider than a phone, so without this the
   card lands off to the right and the turn appears to have done nothing. */
function revealCard(id){
  const el=nodes.get(id), st=$('#stage'); if(!el) return;
  const left=parseFloat(el.style.left), w=parseFloat(el.style.width)||MINW;
  const pad=40, view=st.clientWidth;
  if(left >= st.scrollLeft + pad && left + w <= st.scrollLeft + view - pad) return;
  /* Aim at the START of the bar, not its middle. A long life is a bar wider
     than a phone screen, and centring it pushes the left edge -- which is
     where the name is -- off the side. Centre only what actually fits. */
  const target = (w + pad*2 > view) ? left - pad : left + w/2 - view/2;
  // Smooth scrolling is driven by the frame loop, which does not run while the
  // tab is hidden -- the scroll would simply never happen. Jump instead.
  st.scrollTo({ left: Math.max(0, target),
                behavior: (prefersStill() || document.hidden) ? 'auto' : 'smooth' });
}

function renderHand(){
  const h=$('#hand');
  if(over){
    const why = overWhy || 'The Archive and your hand are empty';
    // A round changes nothing about the family, so the way on from here is the
    // builder -- that is where writing, fixing and saving live.
    h.innerHTML=`<span class="msg"><b>That is the whole span.</b> ${why}.
      Final Legacy: ${window.scoreBoard(played.map(x=>byId[x]),byId,bonuses).total},
      over ${turn-1} turns. <a href="edit.html">Back to your family</a></span>`;
    return;
  }
  let html='';
  if(!dealt){
    // Before the deal there is no turn to take, so offer no buttons rather than
    // live ones sitting behind the draft.
    h.innerHTML='<span class="msg turnmsg">Legacy cards first. Your Kin come once you have chosen.</span>';
    return;
  }
  if(mustDiscard){
    // The turn is already spent; the hand just has to come back under the
    // limit before anything else can happen.
    html=`<span class="msg turnmsg"><b>Your hand is full.</b> Return
      ${mustDiscard} Kin to the Archive to get back to ${SET.handLimit}.</span>`;
  }else{
    // Every button says what the move costs in years -- the clock is the real
    // budget now, so a turn's price belongs on the button that spends it.
    const yr=n=>SET.clockOn?` · ${n}y`:'';
    html+=`<button id="draw" ${!deck.length?'disabled':''}
        title="Pull ${SET.drawCount} Kin from the Archive${SET.clockOn?`. Costs you ${SET.costDraw} years`:''}. Hold more than ${SET.handLimit} and you return some.">
        Pull ${SET.drawCount}${yr(SET.costDraw)} (${deck.length})</button>`;
    if(SET.drawBonus){
      const full=held().length>=SET.maxBonuses;
      const none=!bonusPool().length;
      const swap=full && SET.swapAtCap;
      // A disabled button labelled "Swap" advertises a move you cannot make.
      // Full-with-swapping-off just stays "Take bonus", greyed, and says why.
      html+=`<button id="takeb" ${(none||(full&&!SET.swapAtCap))?'disabled':''}
        title="${none?'No Legacy cards left to claim'
                :swap?'Your hands are full — a new one takes the place of another'
                :full?'You are holding all the Legacy cards this game allows'
                :'Spend this turn on a Legacy card instead of a Kin'}">
        ${swap?'Swap Legacy':'Claim Legacy'}${yr(SET.costBonus)} (${held().length}/${SET.maxBonuses})</button>`;
    }
  }

  // Discarding is per CARD, so a pair has to come apart for it -- you owe a
  // number of cards, not a number of couples.
  const groups = mustDiscard ? hand.map(id=>({ids:[id]})) : handGroups();
  html += groups.map(gp=>{
    const cards = gp.ids.map(id=>handCard(id, gp)).join(
      gp.link ? `<span class="join ${gp.link==='spouse'?'wed':'kid'}"
                   title="${gp.link==='spouse'?'Married — they play together'
                                              :'Parent and child — they play together'}">
                   ${gp.link==='spouse'?HEART:FIGURE}</span>` : '');
    return gp.ids.length>1
      ? `<div class="pair" data-ids="${gp.ids.join(',')}">${cards}</div>`
      : cards;
  }).join('');
  if(!hand.length && !mustDiscard) html+='<span class="msg">Your hand is empty. Pull some Kin.</span>';
  // Keyed like the timeline: unchanged markup is left alone, so the card you
  // are hovering survives the render and its transition keeps running.
  if(!setHTML(h, html)) return;
  h.querySelectorAll('.hc,.pair').forEach(el=>el.classList.add('in'));

  const d=$('#draw');
  if(d){ d.onclick=doDraw;
    d.onmouseenter=()=>{ if(!d.disabled) previewMove(SET.costDraw); };
    d.onmouseleave=()=>previewMove(null); }
  const tb=$('#takeb');
  if(tb){ tb.onclick=doTakeBonus;
    tb.onmouseenter=()=>{ if(!tb.disabled) previewMove(SET.costBonus); };
    tb.onmouseleave=()=>previewMove(null); }
  h.querySelectorAll('.hc').forEach(el=>{
    const id=el.dataset.id;
    const grp=el.closest('.pair');
    const ids=grp ? grp.dataset.ids.split(',') : [id];
    el.onclick=()=>{
      if(mustDiscard) return doDiscard(id);
      // Same two-tap rule as the board: look first, commit second. Playing a
      // card you only meant to read is not a mistake you can take back.
      if(TOUCH && inspecting!==id){ inspecting=id; showPop(id,true,ids); render(ids); return; }
      inspecting=null; doPlay(ids);
    };
    el.onmouseenter=()=>{ if(TOUCH) return;
      showPop(id, true, ids);
      if(!mustDiscard){ render(ids);
        // A relative granted by a Gift, or a banked free Connect, costs nothing.
        const free = (kinFrom && kinIsFree(ids)) || freePlay>0;
        previewMove(mustDiscard ? null : (free ? null : SET.costPlay)); } };
    el.onmouseleave=()=>{ if(TOUCH) return;
      hidePop(true); spotlight(null); previewMove(null); render(); };
  });
}

function handCard(id, gp){
  const p=byId[id];
  // An armed playkin ability makes exactly its own relatives free; say which,
  // or the offer is invisible and you spend the years anyway.
  const free = !mustDiscard && kinFrom && kinIsFree(gp.ids);
  const note = mustDiscard ? '<span class="gain drop">return</span>'
    : free ? '<span class="gain">free</span>'
    : showsPreview(SET) ? `<span class="gain">+${gainOfGroup(gp.ids)}</span>` : '';
  return `<div class="hc ${sideOf(p)} ${mustDiscard?'todiscard':''} ${free?'pairable':''}" data-id="${id}">
      <div class="n ${p.sex==='M'?'m':p.sex==='F'?'f':''}">${esc(p.name)}</div>
      <small>${startY(p)}–${p.living?'':(p.death_year||'?')} · ${esc(tierOf(p))} ${note}</small></div>`;
}

let tt=null;
function toast(m){
  const e=$('#toast'); e.textContent=m; e.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('on'), 2600);
}
function toastHand(m){ $('#hand').innerHTML=`<span class="msg">${esc(m)}</span>`; }

/* ---------------- fan chart ----------------
   An alternate read of the same game, not a second game: your direct line as
   rings around you, so who is on the timeline and who is simply missing are
   both visible at a glance. It reads played[] and the family file and writes
   nothing, so it cannot disturb a round in progress. */
const FAN_GENS=5;

/* rows[g][i] = the person in slot i of generation g, or undefined. Slot i*2 is
   the father, i*2+1 the mother, so slot order left-to-right is the usual fan
   order and the left half of every ring is the paternal side. */
function fanRows(){
  const idx=Object.fromEntries(fam.people.map(p=>[p.id,p]));
  const rows=[];
  (function walk(p,g,i){
    (rows[g]=rows[g]||[])[i]=p;
    if(g>=FAN_GENS) return;
    const par=(p.parent_ids||[]).map(x=>idx[x]).filter(Boolean);
    const f=par.find(x=>x.sex==='M')||par[0];
    const m=par.find(x=>x.sex==='F'&&x!==f)||par.find(x=>x!==f);
    if(f) walk(f,g+1,i*2);
    if(m) walk(m,g+1,i*2+1);
  })(idx[fam.meta.root_id]||fam.people[0],0,0);
  return rows;
}

function fanWedge(cx,cy,r0,r1,a0,a1){
  const P=(r,a)=>[(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)];
  const [x0,y0]=P(r1,a0),[x1,y1]=P(r1,a1),[x2,y2]=P(r0,a1),[x3,y3]=P(r0,a0);
  return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`;
}

/* One name, cut to what fits along the radius rather than shrunk to nothing. */
function fanLabel(p,room){
  const s=(p.given||p.name||'').trim()||'?';
  const max=Math.floor(room/5.4);
  return s.length>max ? s.slice(0,Math.max(1,max-1))+'…' : s;
}

function renderFan(){
  const W=760,cx=W/2,cy=406,R=374,R0=54,step=(R-R0)/FAN_GENS;
  const rows=fanRows(), on=new Set(played);
  let svg='', have=0, here=0, total=0;
  for(let g=1;g<=FAN_GENS;g++){
    const n=2**g, r0=R0+(g-1)*step, r1=r0+step;
    for(let i=0;i<n;i++){
      total++;
      const p=(rows[g]||[])[i];
      const a0=Math.PI+i*Math.PI/n, a1=a0+Math.PI/n, am=(a0+a1)/2;
      const d=fanWedge(cx,cy,r0,r1,a0,a1);
      if(!p){ svg+=`<path class="fw gap" d="${d}"></path>`; continue; }
      have++;
      const played_=on.has(p.id); if(played_) here++;
      const cls=`fw ${i<n/2?'pat':'mat'} ${played_?'here':'dim'}`;
      const note=played_?' · on the timeline':(p.birth_year?'':' · no birth year, so not playable');
      svg+=`<path class="${cls}" d="${d}" data-id="${esc(p.id)}"><title>${
        esc(p.name)}${p.birth_year?' · '+p.birth_year:''}${esc(note)}</title></path>`;
      // Radial text, flipped on the left half so no name reads upside down.
      const mid=r0+step/2, tx=cx+mid*Math.cos(am), ty=cy+mid*Math.sin(am);
      const rot=am*180/Math.PI+(Math.cos(am)<0?180:0);
      svg+=`<text class="fl${played_?'':' faint'}" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}"
        transform="rotate(${rot.toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})"
        font-size="${g<=2?11:9.5}">${esc(fanLabel(p,step))}</text>`;
    }
  }
  const root=rows[0][0];
  // A half disc, so the fan sits flat on its baseline rather than bulging past it.
  svg+=`<path class="fw here" style="fill:var(--selfbg)"
    d="M${cx-R0} ${cy}A${R0} ${R0} 0 0 1 ${cx+R0} ${cy}Z"></path>
    <text class="fl" x="${cx}" y="${cy-24}" font-size="12">${esc(fanLabel(root,90))}</text>
    <text class="fl faint" x="${cx}" y="${cy-11}" font-size="9.5">you</text>`;

  setHTML($('#fsheet'), `
    <h2>Your line, as a fan</h2>
    <p class="sub">${here} of the ${have} direct ancestors in your file are on the
      timeline right now. ${total-have} wedge${total-have===1?' is':'s are'} empty —
      nobody in the file fills ${total-have===1?'it':'them'}. Paternal side left,
      maternal right. Tap anyone to read their card.</p>
    <svg id="fansvg" viewBox="0 0 ${W} ${cy+2}" role="img"
      aria-label="Fan chart of your direct ancestors">${svg}</svg>
    <button id="fclose" style="width:100%">Back to the timeline</button>`);
}

function openFan(){
  if(!fam||!fam.people.length) return;
  renderFan();
  $('#fmodal').classList.add('on');
}
function closeFan(){ $('#fmodal').classList.remove('on'); }

function openCard(p){
  $('#sheet').innerHTML=`
    <div class="rel">${esc(p.relationship_to_root||'')}${p.relationship_side?' · '+p.relationship_side:''}</div>
    <h2>${esc(p.name)}</h2>
    ${p.photo_url?`<img src="${esc(p.photo_url)}" alt="">`:''}
    <div class="traits">${(p.traits||[]).map(t=>
      `<div class="trait"><div class="k">${esc(t.k)}</div><div>${esc(t.v)}</div></div>`).join('')}</div>
    ${(()=>{ const g=(p.abilities||[]).length ? p.abilities : (p.gen_ability?[p.gen_ability]:[]);
      return g.length ? g.map(a=>`
        <div class="abil"><div class="n">${esc(a.name)}</div><div>${esc(a.effect)}</div>
          ${a.story||a.why?`<div class="s">${esc(a.story||a.why)}</div>`:''}</div>`).join('')
      :`<div class="trait" style="margin-bottom:10px"><div class="k">No Gift yet</div>
         <div style="font-size:13px">Learn something about them in the Archive and they will have one.</div></div>`;
    })()}
    ${p.story?`<div class="story">${esc(p.story)}</div>`:''}
    <button onclick="document.getElementById('modal').classList.remove('on')"
      style="width:100%">Close</button>`;
  $('#modal').classList.add('on');
}

$('#modal').onclick=e=>{ if(e.target.id==='modal') e.currentTarget.classList.remove('on'); };
$('#stage').addEventListener('pointerdown', e=>{
  if(e.target.closest('.card') || e.target.closest('#rel')) return;
  closeRel();
  if(TOUCH && inspecting){ inspecting=null; spotlight(null); hidePop(); }
});
$('#score').onclick=()=>{ $('#side').classList.toggle('on'); render(); };
$('#sideclose').onclick=()=>{ $('#side').classList.remove('on'); render(); };
/* The sidebar is a column on a desktop and a pull-up sheet on a phone, so it
   starts open on one and closed on the other. Keyed off the SAME media query
   the CSS uses -- reading innerWidth directly disagreed with the stylesheet
   whenever the window reported an odd size, and left the desktop sidebar shut. */
const NARROW=matchMedia('(max-width: 760px)');
const syncSide=()=>{ $('#side').classList.toggle('on', !NARROW.matches); if(people.length) render(); };
NARROW.addEventListener('change', syncSide);
syncSide();
$('#newgame').onclick=()=>{closeRel(); newGame();};
$('#fanbtn').onclick=()=>{closeRel(); openFan();};
$('#fmodal').onclick=e=>{
  if(e.target.id==='fmodal'||e.target.id==='fclose') return closeFan();
  const w=e.target.closest('.fw[data-id]');
  if(w) openCard(fam.people.find(p=>p.id===w.dataset.id));
};
$('#bonusbtn').onclick=()=>{closeRel(); openBonuses();};
$('#bmodal').onclick=e=>{ if(e.target.id==='bmodal') closeBonuses(); };
$('#practice').onchange=newGame;
addEventListener('resize',()=>{fit();render();});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ $('#modal').classList.remove('on'); closeBonuses(); closeFan(); }
  if(e.key==='Escape' && $('#imodal').classList.contains('on')){
    $('#imodal').classList.remove('on'); beginRound();   // skip the words, not the round
  }
  if(e.key==='d') doDraw();
});
load();
