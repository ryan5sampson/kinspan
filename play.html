<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Added to the home screen, this opens without Safari's chrome. viewport-fit
     lets the layout reach the edges; the safe-area padding below keeps the hand
     bar clear of the home indicator. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kinspan">
<meta name="theme-color" content="#ffffff">
<title>Kinspan — the timeline</title>
<script src="tree.js"></script>
<script src="family.js"></script>
<script src="rules.js"></script>
<style>
  :root{
    --ease:cubic-bezier(.34,1.24,.44,1);
    --clock:#2e6ea0;
    --bg:#f7f4ef; --panel:#ffffff; --edge:#ddd5c9; --ink:#2b2621; --dim:#7d7368;
    --gold:#9a7212; --pat:#2f6f9e; --mat:#a8552a; --self:#2f7a45; --line:#a89d8e;
    --patbg:#e4f0f8; --matbg:#fbeade; --selfbg:#e2f3e6;
    --wed:#c0392b; --kid:#6b5aa8;
    --male:#2b6ca3; --female:#b4437f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);height:100vh;
    height:100dvh;  /* in a browser the address bar eats vh, which cropped the hand */
    display:flex;flex-direction:column;overflow:hidden;
    touch-action:manipulation;  /* keeps pinch-zoom, drops the double-tap zoom */
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{flex:none;z-index:20;background:var(--panel);border-bottom:1px solid var(--edge);
    padding:9px 14px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:650}
  a{color:var(--pat);text-decoration:none;font-size:13px}
  button{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--edge);
    border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13.5px}
  button:hover:not(:disabled){border-color:var(--gold)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
  .sp{flex:1}
  .stat{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .stat b{color:var(--ink);font-size:14px}
  #score{background:#fdf5e0;border-color:#d8bf7a;color:var(--gold);font-weight:640}
  .legend{display:flex;gap:10px;font-size:11px;color:var(--dim);align-items:center}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;
    vertical-align:-1px}

  #wrap{flex:1;min-height:0;display:flex}
  #stage{flex:1;min-width:0;overflow:auto;padding:0 14px 14px}
  #inner{position:relative;min-height:120px}
  #axis{position:sticky;top:0;height:26px;z-index:6;background:var(--bg);
    border-bottom:1px solid var(--edge)}
  .tick{position:absolute;top:0;font-size:11px;color:var(--dim);
    font-variant-numeric:tabular-nums;transform:translateX(-50%)}
  .grid{position:absolute;top:0;bottom:0;width:1px;background:#e8e1d6}
    /* Above every card state (hover 9, ghost 10, onpath 12): the heart and the
     birth bubble ride ON the bars, so a raised card must not swallow them. */
  svg#links{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:13}
  svg#drag{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:30}
  body.dragging{cursor:crosshair;user-select:none}
  body.dragging .card{cursor:crosshair}
  .card.dragsrc{box-shadow:0 0 0 3px rgba(154,114,18,.5)}
  .card.dragtgt{box-shadow:0 0 0 3px rgba(47,122,69,.55)}
  .card.onpath{box-shadow:0 0 0 2.5px var(--gold);z-index:12}
  #links .kin.dim,#links .mar.dim{opacity:.15}
  #links .kin.hot{opacity:1}
  /* Only the connector line thickens on hover -- the badge riding on it keeps
     its own stroke, or the little figure inside would swell into a blob. */
  #links path.kin.hot{stroke-width:3.4}

  .card{position:absolute;height:28px;border-radius:6px;border:1px solid;
    display:flex;align-items:center;padding:0 7px;cursor:pointer;overflow:hidden;
    white-space:nowrap;font-size:12px;z-index:3;transition:filter .12s,opacity .12s}
  .card:hover{filter:brightness(.96);box-shadow:0 2px 7px rgba(0,0,0,.16);z-index:9}
    .card .nm{overflow:hidden;text-overflow:ellipsis}
  .card .nm.m{color:var(--male)} .card .nm.f{color:var(--female)}
  .card.pat{background:var(--patbg);border-color:var(--pat);color:#1d3d55}
  .card.mat{background:var(--matbg);border-color:var(--mat);color:#5e2f14}
  .card.self{background:var(--selfbg);border-color:var(--self);color:#1d4a2c}
  .card .pips{margin-left:auto;color:var(--gold);font-size:10px;padding-left:5px}
  .evt{position:absolute;top:50%;transform:translate(-50%,-50%);pointer-events:none;
    display:flex;align-items:center;justify-content:center;z-index:6}
  .evt svg{display:block}
  .evt.wed svg{fill:var(--wed)}
  .evt.kid svg{fill:none;stroke:var(--kid);stroke-width:2.6;stroke-linecap:round}
  /* Hand states for the three kinds of turn. */
  /* A pair reads as one object: the two cards butt together with the icon in
     the seam, and hovering either lights both, because clicking either plays
     both. */
  .pair{display:flex;align-items:stretch;flex:none}
  .pair .hc{border-radius:9px 0 0 9px;border-right:0}
  .pair .hc:last-child{border-radius:0 9px 9px 0;border-right:1px solid var(--edge);
    border-left:0}
  .pair .join{flex:none;display:flex;align-items:center;justify-content:center;
    width:24px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);
    background:#fdfbf7}
  .pair .join.wed svg{fill:var(--wed)}
  .pair .join.kid svg{fill:none;stroke:var(--kid);stroke-width:2.6;stroke-linecap:round}
  .pair:hover .hc,.pair:hover .join{border-color:var(--gold);background:#fffdf6}
  .pair:hover{box-shadow:0 3px 9px rgba(0,0,0,.12);border-radius:9px}
  .hc.todiscard{border-color:#d99a6c}
  .hc.todiscard:hover{background:var(--warnbg)}
  .hc .gain.drop{color:#b4671d}
  .turnmsg{padding-right:4px}
  .card.living::after{content:'';position:absolute;right:0;top:0;bottom:0;width:26px;
    background:linear-gradient(90deg,transparent,var(--bg));pointer-events:none}
  .card.unknownend{border-right-style:dashed;border-right-width:2px}
  .card{transition:left .42s var(--ease),top .42s var(--ease),width .42s var(--ease),
        opacity .18s,filter .12s,box-shadow .18s}
  /* A card arriving on the timeline drops in and settles, rather than simply
     existing where it did not a frame ago. */
  @keyframes land{
    0%  {transform:translateY(-16px) scale(.9);opacity:0}
    62% {transform:translateY(2px)   scale(1.03);opacity:1}
    100%{transform:none;opacity:1}
  }
  .card.landing{animation:land .42s var(--ease) both}
  @keyframes dealin{
    from{transform:translateY(22px) scale(.94);opacity:0}
    to  {transform:none;opacity:1}
  }
  .hc.in,.pair.in{animation:dealin .32s var(--ease) both}
  .hc{transition:transform .16s var(--ease),box-shadow .16s,border-color .16s,background .16s}
  .hc:hover{transform:translateY(-5px)}
  .pair:hover .hc{transform:translateY(-5px)}
  /* Sidebar entries: a bonus that just ticked up should say so. */
  @keyframes bump{
    0%{transform:none} 35%{transform:scale(1.045)} 100%{transform:none}
  }
  .ab.bumped{animation:bump .34s var(--ease)}
  @keyframes slidein{ from{opacity:0;transform:translateX(14px)} to{opacity:1;transform:none} }
  .ab.fresh{animation:slidein .3s var(--ease) both}
  .sheet{animation:sheetin .26s var(--ease) both}
  @keyframes sheetin{ from{opacity:0;transform:translateY(14px) scale(.97)} to{opacity:1;transform:none} }
  #modal,#bmodal,#imodal,#fmodal{transition:opacity .2s}
  #insp{transition:opacity .18s var(--ease),transform .18s var(--ease)}
  #insp.on{animation:inspin .22s var(--ease) both}
  @keyframes inspin{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  #score{transition:transform .2s var(--ease),background .2s}
  #sideclose,#inspmore,#sidenav{display:none}
  #sidenav{gap:16px;padding:0 0 12px;margin-bottom:10px;
    border-bottom:1px solid var(--edge)}
  #sidenav a{font-size:14px;padding:6px 0}
  #sideclose{position:absolute;top:10px;right:12px;font-size:20px;line-height:1;
    color:var(--dim);cursor:pointer;padding:4px 8px}
  #inspmore{margin-top:8px;width:100%;text-align:center;font-size:12.5px;
    color:var(--gold);border:1px solid #e2cd9b;background:#fdf5e0;border-radius:8px;
    padding:9px;cursor:pointer}
  .card.armed{box-shadow:0 0 0 3px var(--gold),0 4px 14px rgba(0,0,0,.2)}
  /* The marker. It sits above the cards but under the drag layer, and moves
     with the same easing as everything else so a turn reads as a step. */
  #clockline{position:absolute;top:0;bottom:0;width:2px;background:var(--clock);
    z-index:12;pointer-events:none;transition:left .42s var(--ease)}
  #clockline::before{content:'';position:absolute;left:-9px;right:-9px;top:0;bottom:0;
    background:linear-gradient(90deg,transparent,rgba(46,110,160,.10),transparent)}
  #clockyear{position:absolute;top:2px;left:50%;transform:translateX(-50%);
    background:var(--clock);color:#fff;font-size:10.5px;font-weight:660;
    padding:2px 7px;border-radius:6px;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  /* Where the marker WOULD go, shown while you hover a move. The band is the
     years that move would cost you; the dashed line is where you would land. */
  #clockband{position:absolute;top:0;bottom:0;z-index:11;pointer-events:none;
    background:rgba(46,110,160,.11);border-left:1px solid rgba(46,110,160,.25);
    border-right:1px solid rgba(46,110,160,.25);display:none}
  #clockband.on{display:block}
  #clockband.back{background:rgba(154,114,18,.14);
    border-color:rgba(154,114,18,.3)}
  #clockband.ends{background:rgba(180,103,29,.15);border-color:rgba(180,103,29,.35)}
  #clockghost{position:absolute;top:0;bottom:0;width:0;z-index:12;pointer-events:none;
    border-left:2px dashed var(--clock);display:none}
  #clockghost.on{display:block}
  #clockghost.back{border-color:var(--gold)}
  #clockghost.ends{border-color:var(--warn)}
  #ghostyear{position:absolute;top:2px;left:0;transform:translateX(-50%);
    background:var(--panel);color:var(--clock);border:1px solid var(--clock);
    font-size:10.5px;font-weight:660;padding:1px 6px;border-radius:6px;
    white-space:nowrap;font-variant-numeric:tabular-nums}
  #clockghost.back #ghostyear{color:var(--gold);border-color:var(--gold)}
  #clockghost.ends #ghostyear{color:var(--warn);border-color:var(--warn)}
  /* Alive when the marker passes: a quiet lift, not a spotlight -- several
     cards are lit at once and a loud treatment would drown the board. */
  .card.alive{box-shadow:0 0 0 1.5px var(--clock),0 2px 8px rgba(46,110,160,.22)}
  /* The Gift is a real control on the Kin's own bar, at the end of their life.
     Grey while it cannot fire, lit when it can. */
  .gbtn{position:absolute;right:3px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:6px;border:1px solid var(--edge);
    background:#f2efe9;color:#a49a8c;font-size:12px;line-height:1;padding:0;
    display:flex;align-items:center;justify-content:center;cursor:default;
    pointer-events:auto;z-index:3;transition:background .15s,color .15s,box-shadow .15s}
  .gbtn.live{background:var(--gold);border-color:var(--gold);color:#fff;cursor:pointer;
    box-shadow:0 0 0 3px rgba(154,114,18,.22)}
  .gbtn.live:hover{box-shadow:0 0 0 4px rgba(154,114,18,.34)}
  .gbtn.spent{opacity:.4}
  /* A small floating card for the Gift, shown from the button itself. */
  #gtip{position:fixed;z-index:55;width:236px;background:var(--panel);
    border:1px solid #ddc487;border-left:4px solid var(--gold);border-radius:10px;
    padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.22);display:none;
    pointer-events:none}
  #gtip.on{display:block;animation:inspin .18s var(--ease) both}
  #gtip .n{color:var(--gold);font-weight:650;font-size:13.5px}
  #gtip .e{font-size:12px;color:#4a423a;line-height:1.45;margin-top:3px}
  #gtip .w{font-size:11.5px;color:var(--dim);font-style:italic;margin-top:4px}
  #gtip .m{font-size:11.5px;color:var(--dim);margin-top:6px}
  #gtip .go{font-size:11.5px;color:var(--gold);font-weight:640;margin-top:7px}
  .ability{border:1px solid #ddc487;background:#fdf7e6;border-radius:9px;
    padding:9px 10px;margin-bottom:7px}
  .ability .n{color:var(--gold);font-weight:650;font-size:13px}
  .ability .e{font-size:11.5px;color:#5c5348;line-height:1.45;margin-top:2px}
  .ability .w{font-size:11px;color:var(--dim);font-style:italic;margin-top:3px}
  .ability button{width:100%;margin-top:7px;min-height:34px}
  .ability.spent{opacity:.5;background:#f6f4f0;border-color:var(--edge)}
  .clockbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;
    margin-bottom:11px;font-variant-numeric:tabular-nums}
  .clockbar .gifts{flex:1 0 100%}
  .clockbar b{font-size:19px;color:var(--clock)}
  .clockbar span{font-size:11.5px;color:var(--dim)}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important}
  }
  .card.ghost{border-style:dashed;border-width:2.5px;z-index:10;animation:none;opacity:.92}
  .card.ghost.pat{border-color:var(--pat)}
  .card.ghost.mat{border-color:var(--mat)}
  .card.ghost.self{border-color:var(--self)}
  .card.shift{filter:brightness(.92)}
  .card.fresh{animation:land .42s var(--ease) both}
  @keyframes pop{from{transform:scale(.9);box-shadow:0 0 0 5px rgba(154,114,18,.35)}to{transform:none}}

  /* Open by default now: the bonus cards live here, and a bonus you cannot see
     is a rule you have to remember instead of one you can play toward. */
  #side{width:288px;flex:none;border-left:1px solid var(--edge);background:var(--panel);
    overflow:auto;padding:12px;display:none}
  #side.on{display:block}
  /* Everything about Legacy lives in this one panel now -- the running total
     included, rather than floating in the header away from its own breakdown. */
  #legacytotal{display:flex;align-items:baseline;gap:7px;padding:2px 0 12px;
    border-bottom:1px solid var(--edge);margin-bottom:12px}
  #legacytotal b{font-size:34px;font-weight:660;color:var(--gold);line-height:1;
    font-variant-numeric:tabular-nums}
  #legacytotal span{font-size:12px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.09em}
  #legacytotal.bump b{animation:bump .32s var(--ease)}
  #side h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
    margin:0 0 8px}
  .sl{border-bottom:1px solid var(--edge);padding:7px 0}
  .sl .t{display:flex;justify-content:space-between;font-size:13.5px}
  .sl .t b{color:var(--gold)}
  .sl .d{color:var(--dim);font-size:11.5px;margin-top:2px;line-height:1.4}
  .sl.big{background:#fdf5e0;margin:6px -6px;padding:8px 6px;border-radius:7px;border:0}

  #hand{flex:none;background:var(--panel);border-top:1px solid var(--edge);
    padding:9px 14px;display:flex;gap:8px;align-items:center;overflow-x:auto;z-index:20}
  .hc{flex:none;border:1px solid var(--edge);border-radius:9px;padding:7px 10px;
    cursor:pointer;background:#fff;white-space:nowrap;min-width:130px;
    box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .hc:hover{border-color:var(--gold);background:#fffdf6;box-shadow:0 3px 9px rgba(0,0,0,.12)}
    .hc .n{font-size:13px}
  .hc .n.m{color:var(--male)} .hc .n.f{color:var(--female)}
  .hc small{color:var(--dim);display:block;font-size:10.5px}
  .hc.pat{border-left:3px solid var(--pat)} .hc.mat{border-left:3px solid var(--mat)}
  .hc.self{border-left:3px solid var(--self)}
  .gain{color:var(--gold);font-size:10.5px}
  .msg{color:var(--dim);font-size:13px}

  /* The details panel lives low, in the empty space under the timeline, rather
     than floating over the board where it covered the cards you were comparing.
     pointer-events:none is deliberate: it can never steal a hover from the card
     that opened it, and never blocks a drag passing over it. */
  #insp{position:fixed;left:14px;right:14px;bottom:92px;z-index:40;pointer-events:none;
    background:var(--panel);border:1px solid var(--edge);border-left:4px solid var(--accent,var(--gold));
    border-radius:11px;padding:12px 15px;box-shadow:0 10px 30px rgba(0,0,0,.13);
    display:none;gap:22px;align-items:flex-start;max-height:34vh;overflow:hidden}
  #insp.on{display:flex}
  /* Stop at the sidebar rather than sliding under it. Keyed off the panel's own
     open state so it still uses the full width when the sidebar is closed. */
  body:has(#side.on) #insp{right:317px}
  #insp .who{flex:0 0 236px;min-width:0}
  #insp .rel{color:var(--accent,var(--gold));font-size:10px;text-transform:uppercase;
    letter-spacing:.09em}
  #insp h4{margin:2px 0 4px;font-size:19px;font-weight:640;line-height:1.15}
  #insp h4.m{color:var(--male)} #insp h4.f{color:var(--female)}
  #insp .life{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  #insp .facts{flex:1 1 260px;min-width:0;display:grid;
    grid-template-columns:auto 1fr;gap:2px 12px;align-content:start;font-size:12.5px}
  #insp .facts span:nth-child(odd){color:var(--dim)}
  #insp .extra{flex:1 1 300px;min-width:0}
  #insp .ab{border:1px solid #ddc487;background:#fdf7e6;border-radius:7px;
    padding:6px 9px;margin-bottom:5px}
  #insp .ab b{color:var(--gold);font-size:12.5px}
  #insp .ab div{font-size:11.5px;color:#5c5348}
  #insp .conn{font-size:11.5px;color:var(--dim);line-height:1.5}
  #insp .conn b{color:var(--ink);font-weight:500}
  #insp .story{font-size:11.5px;color:#5c5348;line-height:1.5;margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #insp .gainbig{margin-top:7px;background:#fdf5e0;border:1px solid #d8bf7a;
    border-radius:7px;padding:6px 9px;display:flex;justify-content:space-between;
    font-size:12.5px;font-weight:600}
  #insp .gainbig b{color:var(--gold)}
  /* The panel itself stays click-through so it can never steal a hover or
     block a drag; only the Use button takes the pointer. */
  #insp .act{pointer-events:auto}
  .gift{border:1px solid #ddc487;background:#fdf7e6;border-radius:9px;
    padding:9px 11px;margin-bottom:7px}
  .gift.live{box-shadow:0 0 0 2px rgba(154,114,18,.28)}
  .gift.spent{opacity:.55;background:#f6f4f0;border-color:var(--edge)}
  .gift .gn{color:var(--gold);font-weight:650;font-size:13.5px}
  .gift .ge{font-size:12px;color:#4a423a;line-height:1.45;margin-top:2px}
  .gift .gw{font-size:11.5px;color:var(--dim);font-style:italic;margin-top:3px}
  .gift .gm{font-size:11.5px;color:var(--dim);margin-top:5px}
  .gift .act{margin-top:7px}
  .gift button{width:100%;min-height:34px;background:var(--gold);color:#fff;
    border-color:var(--gold);font-weight:640}
  .clockbar .gifts{color:var(--gold)}
  #insp .gainbig.blind{background:#f6f4f0;border-color:var(--edge);color:var(--dim);
    font-weight:500}
  .ab .hid{color:var(--dim);opacity:.6}
  #insp .hintrow{font-size:11.5px;color:var(--dim);margin-top:5px}
  #rel{position:fixed;z-index:45;max-width:400px;background:var(--panel);
    border:1px solid var(--edge);border-left:4px solid var(--gold);border-radius:11px;
    padding:13px 15px;display:none;box-shadow:0 16px 40px rgba(0,0,0,.22)}
  #rel.on{display:block}
  #rel .hd{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
  #rel .big{font-size:17px;font-weight:640;margin:3px 0 2px}
  #rel .big em{font-style:normal;color:var(--gold)}
  #rel .sub{font-size:12px;color:var(--dim);margin-bottom:9px}
  #rel .chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;
    line-height:1.7}
  #rel .pn{padding:2px 7px;border-radius:6px;border:1px solid var(--edge);background:#faf7f2;
    white-space:nowrap}
  #rel .pn.m{color:var(--male)} #rel .pn.f{color:var(--female)}
  #rel .pn.off{border-style:dashed;border-color:var(--warn);background:var(--warnbg)}
  #rel .lk{color:var(--dim);font-size:10.5px}
  #rel .need{margin-top:10px;background:var(--warnbg);border:1px solid #e8c79a;
    border-radius:8px;padding:8px 10px;font-size:12.5px;color:#6b4413}
  #rel .need b{color:var(--warn)}
  #rel .x{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--dim);
    font-size:15px;line-height:1}
  #modal,#bmodal,#imodal,#fmodal{position:fixed;inset:0;background:rgba(60,50,40,.34);display:none;z-index:50;
    align-items:center;justify-content:center;padding:16px}
  #modal.on,#bmodal.on,#imodal.on,#fmodal.on{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--edge);border-radius:13px;
    max-width:430px;width:100%;max-height:88vh;overflow:auto;padding:18px;
    box-shadow:0 18px 48px rgba(0,0,0,.24)}
  .sheet .rel{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.09em}
  .sheet h2{margin:4px 0 10px;font-size:22px}
  .traits{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .trait{background:#faf7f2;border:1px solid var(--edge);border-radius:7px;padding:6px 9px}
  .trait .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
  .abil{border:1px solid #ddc487;background:#fdf7e6;border-radius:9px;padding:10px;margin-bottom:8px}
  .abil .n{color:var(--gold);font-weight:640;font-size:14px}
  .abil .s{color:var(--dim);font-size:12.5px;font-style:italic;margin-top:4px}
  .story{font-size:13.5px;color:#4a423a;white-space:pre-wrap;margin-bottom:10px}
  .sheet img{width:100%;border-radius:8px;margin-bottom:10px}
  .empty{color:var(--dim);padding:28px 4px;font-size:14px}

  /* ---- bonus cards ---- */
  .sheet.wide{max-width:720px}
  /* Fan chart. Same board, read as rings instead of a line: a wedge with no
     name in it is a person you have not found yet. */
  #fansvg{width:100%;height:auto;display:block;margin:2px 0 6px}
  .fw{stroke:var(--panel);stroke-width:1.5;fill:#f2ede5}
  .fw.pat{fill:var(--patbg)} .fw.mat{fill:var(--matbg)}
  .fw.gap{fill:#f4f0e9;stroke:var(--edge);stroke-dasharray:3 3}
  .fw.dim{opacity:.4}
  .fw.here{stroke:var(--self);stroke-width:2.5}
  .fw:not(.gap){cursor:pointer}
  .fw:not(.gap):hover{filter:brightness(.94)}
  .fl{text-anchor:middle;dominant-baseline:middle;fill:var(--ink);pointer-events:none}
  .fl.faint{fill:var(--dim)}
  .sheet .sub{color:var(--dim);font-size:13px;margin:0 0 14px;line-height:1.5}
  .bcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .bc{border:1.5px solid var(--edge);border-radius:10px;padding:10px 11px;cursor:pointer;
    background:#fdfbf7;position:relative;transition:border-color .12s,background .12s}
  .bc:hover{border-color:#c9b184}
  .bc.on{border-color:var(--gold);background:#fdf5e0;box-shadow:0 0 0 1px var(--gold) inset}
  .bc .g{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
  .bc .n{font-weight:640;font-size:14px;margin:1px 0 3px}
  .bc .b{font-size:11.5px;color:#5c5348;line-height:1.42}
  .bc .p{position:absolute;top:9px;right:10px;font-size:10.5px;color:var(--gold);font-weight:640}
  .bc.dead{opacity:.45}
  .brow{display:flex;align-items:center;gap:14px;margin-top:16px}
  .brow .sp{flex:1}
  .brow label{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:5px;cursor:pointer}
  /* Active bonuses in the sidebar: a bonus sitting at 0 still has to be
     visible, or you cannot see what you are supposed to be chasing. */
  .ab{border:1px solid var(--edge);border-radius:8px;padding:7px 9px;margin-bottom:7px;
    background:#fdfbf7}
  .ab.scoring{background:#fdf5e0;border-color:#e2cd9b}
  .ab .t{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
  .ab .t b{color:var(--gold)}
  .ab .b{font-size:11px;color:var(--dim);line-height:1.4;margin-top:3px}
  .ab .d{font-size:11px;color:#6d6055;line-height:1.4;margin-top:4px}
  .ab.base{background:#f4f6f3;border-color:#cfd8cd}
  .ab .tag{font-size:9px;text-transform:uppercase;letter-spacing:.08em;border-radius:4px;
    padding:1px 5px;margin-left:6px;vertical-align:1px}
  .ab .tag.b{background:#e3ebe2;color:#4a6b52}
  .ab .tag.x{background:#fdf5e0;color:var(--gold);border:1px solid #e2cd9b}
  #isheet .hello{color:var(--gold);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.11em}
  #isheet h2{font-size:26px;letter-spacing:-.015em}
  #isheet .sub{color:var(--dim);font-size:13.5px;line-height:1.55;margin:0 0 15px;max-width:56ch}
  #isheet .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:2px 22px}
  #isheet .rule{display:flex;gap:11px;padding:7px 0;border-top:1px solid var(--edge);
    font-size:12.5px;line-height:1.5}
  #isheet .rule .k{flex:0 0 78px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.07em;font-size:10px;padding-top:2px}
  #isheet .rule .v{flex:1;color:#4a423a}
  #bsheet select{font:inherit;padding:4px 7px;border:1px solid var(--edge);
    border-radius:6px;background:var(--panel);color:var(--ink)}
  /* Poker flips and bonus takes need to announce themselves -- they happen
     without a click, so nothing else on screen would explain the score moving. */
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;
    background:#332c24;color:#fdf8ef;padding:9px 15px;border-radius:9px;font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
  /* ---------------------------------------------------------------
     PHONE OVERRIDES LIVE LAST ON PURPOSE. They lost to base rules of
     equal specificity written further down the file -- #insp kept its
     desktop pointer-events:none and its 236px fixed column, which on a
     phone became 236px of empty height under the name and a panel you
     could not scroll with a finger. Anything added below this block
     will silently override it, so add above.
     --------------------------------------------------------------- */
  /* ------------------------------------------------------------------
     Phones. Three structural changes, not just smaller type:
       - the sidebar stops being a column and becomes a sheet you pull up,
         because 288px of a 390px screen is most of the board;
       - the details panel goes full width and single column;
       - anything you tap gets a 40px target.
     ------------------------------------------------------------------ */
  @media (max-width: 760px){
    /* Two deliberate rows -- identity and score on top, controls beneath.
       Letting it wrap on its own gave three rows and 137px of a 812px screen,
       with the score chip landing wherever the wrap happened to put it. */
    header{padding:6px 10px;gap:7px;row-gap:5px;align-items:center}
    h1{font-size:14px;flex:0 0 auto;order:1}
    header a{display:none}
    header .stat{order:2}
    header #score{order:3;margin-left:auto;padding:4px 11px;min-height:32px;
      display:flex;align-items:center}
    header .legend{display:none}
    header .sp{display:none}
    /* Force the break: everything from here starts row two. */
    header::after{content:'';flex-basis:100%;height:0;order:3}
    header #bonusbtn{order:5} header #newgame{order:6}
    #sidenav{display:flex}
    header label.stat{order:5;font-size:11px}
    /* "use every Kin" is most of a phone row on its own. */
    header label.stat{font-size:0}
    header label.stat::after{content:'every Kin';font-size:11px;margin-left:4px}
    button{padding:7px 11px;min-height:36px;font-size:13px}

    /* The sidebar becomes a sheet. It already toggles on the score chip, so
       the control the phone needs is the one the desktop already had. */
    #side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;z-index:45;
      max-height:72vh;border-left:0;border-top:1px solid var(--edge);
      border-radius:14px 14px 0 0;box-shadow:0 -12px 34px rgba(0,0,0,.2);
      padding:14px 14px 22px;transform:translateY(100%);transition:transform .28s var(--ease);
      display:block}
    #side.on{transform:none}
    #side::before{content:'';position:absolute;top:7px;left:50%;transform:translateX(-50%);
      width:38px;height:4px;border-radius:2px;background:var(--edge)}
    #sideclose{display:block}

    #stage{padding:0 8px 10px}
    /* The panel scrolls on a phone, so it has to take the finger. The reason it
       is click-through on a desktop -- never steal a hover -- does not exist on
       a touch screen, where the panel is pinned by a tap in the first place. */
    #insp{left:6px;right:6px;bottom:80px;flex-direction:column;gap:9px;
      max-height:52vh;overflow:auto;padding:11px 13px;pointer-events:auto;
      -webkit-overflow-scrolling:touch}
    body:has(#side.on) #insp{right:6px}
    #insp .who,#insp .facts,#insp .extra{flex:none;width:100%}
    #insp .facts{grid-template-columns:auto 1fr}
    #insp h4{font-size:17px}
    #inspmore{display:block}

    /* On the home screen there is no browser chrome under the hand, so the
       home indicator sits right on top of the cards without this. */
    #hand{padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
      gap:7px;-webkit-overflow-scrolling:touch}
    #side{padding-bottom:calc(22px + env(safe-area-inset-bottom))}
    .hc{min-width:118px;padding:9px 11px}
    .hc .n{font-size:12.5px}
    /* These wrapped to three lines on a phone; a turn's name and its price
       belong on one. */
    #hand button{min-height:40px;white-space:nowrap;font-size:12.5px;padding:7px 10px}
    /* The bar is 28px tall, so this is as big as the target can honestly get.
       First tap explains the Gift, second uses it -- same rule as the rest. */
    .gbtn{width:26px;height:26px;right:1px;font-size:13px}
    #gtip{width:260px}

    .sheet{max-height:92vh;border-radius:14px;padding:15px}
    .sheet.wide{max-width:100%}
    .bcs{grid-template-columns:1fr}
    #isheet .rules{grid-template-columns:1fr}
    #modal,#bmodal,#imodal,#fmodal{padding:8px;align-items:flex-end}
    #rel{left:6px;right:6px;width:auto;max-width:none}
    #toast{bottom:150px;left:8px;right:8px;transform:none;text-align:center}
    #toast.on{transform:translateY(-6px)}
    /* A finger drag on a card is a relate-gesture once armed, so stop the page
       scrolling underneath it. Before the long-press fires, scrolling is free. */
    body.dragging{overflow:hidden;touch-action:none}
    body.dragging #stage{touch-action:none}
  }

<script>
const LANE_H=28, LANE_GAP=11, COUPLE_GAP=0, TOP=40, MINW=52, XGAP=10;
const NOW=new Date().getFullYear();
let people=[], byId={}, pxYear=7, span=[1870,NOW];
let deck=[], hand=[], played=[], turn=0, fresh=null, over=false;
/* Active bonus cards, by id. These are now the ONLY source of points beyond a
   flat 1 per ancestor -- marriage, descent and lineage are bonuses like any
   other, so a game that drafted neither really does score differently. */
/* Entries are {id, baseline?, mult?, faceDown?} -- richer than a bare id
   because poker mode, the doubled river and the always-on family defaults all
   need to say something about a card beyond which one it is. */
let bonuses=[], offer=[], pickAll=false, pending=[], dealt=false, SET=loadSettings();

/* ---- the clock --------------------------------------------------------
   A marker walking the timeline. Actions cost years; the game ends when it
   runs off the end. Abilities are gated on it standing inside a person's
   lifetime, which is what makes WHEN you play someone matter. */
let clock=0, clockDir=1, clockSpan=[0,0], turned=false, usedAbil=new Set(), freePlay=0;
let overWhy=null;   // why the game ended, recorded where it happens
const bonusIds=()=>bonuses.map(b=>b.id);
/* Cards YOU are holding: not the always-on family defaults, and not the ones
   poker mode turned face up at you. The cap governs what you chose to take --
   counting the game's own flips against it let a flip push you over the cap
   and turn the Take button into a Swap you never asked for. */
const held=()=>bonuses.filter(b=>!b.baseline && !b.flip);
const $=s=>document.querySelector(s);
/* What a Kin is called at each level of how much you know about them. The
   stored values stay basic/uncommon/rare so old saves and the builder keep
   working; only the word the player reads changes. */
const TIERWORD={basic:'Sketch', uncommon:'Story', rare:'Biography'};
const tierOf=p=>TIERWORD[p.tier]||p.tier||'';
/* Coarse pointer = no hover to rely on. Checked once; the layout media query
   keys off width, but the interaction has to key off the input device. */
const TOUCH=matchMedia('(hover: none), (pointer: coarse)').matches;
let inspecting=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const startY=p=>p.birth_year, endY=p=>p.death_year||NOW;
const sideOf=p=>p.relationship_to_root==='self'?'self'
              :(p.relationship_side==='maternal'?'mat':'pat');
const X=y=>(y-span[0])*pxYear;

let fam=null;   // the loaded family: people, byId, graph, meta (see family.js)

async function load(){
  // No backend and NO bundled family — Kinspan ships with nobody in it. The
  // player brings a file on the title screen; FAMILY.load() returns what they
  // brought, or the autosave from a previous session, or null. Null is not an
  // error: they just have not loaded anything yet, so send them to do that.
  try{
    fam=await FAMILY.load();
  }catch(err){ fam=null; }
  if(!fam){ location.replace('./'); return; }

  people=FAMILY.playable(fam);
  people.forEach(p=>byId[p.id]=p);
  if(!people.length){
    toast('No one in this family has a birth year, so there is no timeline to build.');
  }
  const nameEl=$('#famname');
  if(nameEl) nameEl.textContent=fam.meta.title||'';
  // Place bonuses are built from THIS tree, so they name real places from it.
  buildBonuses(people);
  const ys=people.flatMap(p=>[startY(p),endY(p)]);
  span=[Math.floor(Math.min(...ys)/10)*10, Math.ceil(Math.max(...ys)/10)*10];
  fit(); newGame();
}
function fit(){ pxYear=Math.max(4.5,($('#stage').clientWidth-28)/(span[1]-span[0])); }

/* ---------------- game ---------------- */
function newGame(){
  SET=loadSettings();
  const pool=people.filter(p=>$('#practice').checked ? true : p.ready);
  deck=shuffle(pool.map(p=>p.id));
  // The hand is NOT dealt yet. You pick your bonuses first and are dealt into
  // them, so the opening hand is something you read against objectives you
  // already know -- dealing first made the draft an afterthought.
  hand=[]; played=[]; turn=1; over=false; fresh=null; pickAll=false;
  mustDiscard=0; dealt=false; lastPts={}; shownScore=null; inspecting=null; giftTapped=null;
  abilPts=0; kinFrom=null; overWhy=null;
  buildAbilities(people, SET.abilityRate);
  clockInit();

  // The baseline rides along as ordinary bonus entries, flagged so the sidebar
  // can label them and the draft can never offer one back to you.
  bonuses = SET.defaults ? BASELINE.map(id=>({id, baseline:true})) : [];

  const pool2=shuffle(draftPool(SET));
  const keep=Math.min(SET.keep, pool2.length);
  pending=[];                                  // poker's face-down flips
  if(SET.selection==='all'){
    offer=pool2; pickAll=true;
  } else if(SET.selection==='random'){
    offer=[];
    pool2.splice(0,keep).forEach(id=>bonuses.push({id}));
  } else {
    offer=pool2.slice(0,Math.min(SET.deal, pool2.length));
  }
  if(SET.reveal==='poker'){
    // Held back from the same shuffle, so a flip can never repeat what you kept.
    const rest=pool2.filter(id=>!bonusIds().includes(id) && !offer.includes(id));
    pending=rest.slice(0,SET.pokerFlips).map((id,i)=>({
      id, turn:(i+1)*SET.pokerEvery,
      mult:(SET.river && i===SET.pokerFlips-1) ? 2 : 1 }));
  }
  render();
  if(!pool.length){
    toastHand('No Kin are marked ready yet. Tick some in the Archive, or leave “use every Kin” on.');
    return;
  }
  if(SET.showIntro) openIntro(); else beginRound();
}

/* Bonuses first, then the deal. */
function beginRound(){
  if(SET.selection==='random'){ announceRandom(); dealOpening(); }
  else openBonuses();
}

function dealOpening(){
  if(dealt) return;
  dealt=true;
  const n=Math.min(SET.openingHand, deck.length);
  // One card at a time so it reads as a deal rather than a hand appearing.
  const step=i=>{
    if(i>=n){ toast(`${n} Kin in hand. Your Legacy cards: ${held().map(b=>BONUS_BY_ID[b.id].name).join(' · ')}`); return; }
    hand.push(deck.shift()); render();
    setTimeout(()=>step(i+1), 110);
  };
  step(0);
}

/* ---- the welcome ------------------------------------------------------
   Every round, because the rules are configurable and the round you are about
   to play may not be the one you played last. It states THIS game's rules, not
   a generic tutorial -- and it can be switched off, here or in settings. */
function rulesLines(){
  const L=[];
  L.push(['Legacy', `Every Kin you connect is worth <b>${RULES.PRESENCE}</b> Legacy. `
    + (SET.defaults
      ? 'Family ties count on top, for free: <b>+1</b> a parent and child, '
        + '<b>+2</b> a married couple, and your longest line grows 3 / 9 / 27.'
      : 'Nothing else counts unless a Legacy card says so.')]);
  const pool=draftPool(SET).length;
  L.push(['Legacy cards', SET.selection==='all'
      ? `Take any you like from all <b>${pool}</b>. This is where most of your Legacy comes from.`
      : SET.selection==='random'
      ? `<b>${Math.min(SET.keep,pool)}</b> handed to you, no choosing. This is where most of your Legacy comes from.`
      : `You are shown <b>${Math.min(SET.deal,pool)}</b> and keep <b>${Math.min(SET.keep,pool)}</b>. `
        + 'This is where most of your Legacy comes from.']);
  if(SET.reveal==='poker') L.push(['More to come', `<b>${SET.pokerFlips}</b> more Legacy cards `
    + `turn face up as you go, one every <b>${SET.pokerEvery}</b> turns`
    + `${SET.river?', and the last one is worth <b>double</b>':''}. `
    + 'You are guessing at what is still hidden.']);
  if(SET.clockOn){
    const dirTxt={forward:'walks forward to the present',
      backward:'walks backward from the present',
      forwardback:'walks to the present and all the way home again',
      backwardforward:'walks back to the beginning, then forward again'}[SET.clockDir];
    L.push(['The marker', `It starts at <b>${clockSpan[0]}</b> and ${dirTxt}. `
      + `Everything you do spends years, and the game ends when the years run out. `
      + `Hover a move to see where it would leave the marker before you commit.`]);
    if(SET.abilityRate>0)
      L.push(['Gifts', `Some Kin have a Gift — the <b>✦</b> at the end of their life. `
        + `It lights up only while the marker stands <b>inside their lifetime</b>, and it works once`
        + ((SET.clockDir==='forwardback'||SET.clockDir==='backwardforward')
           ? ` — until the marker turns around, when every Gift comes back.` : `.`)
        + ` A Gift does what a turn cannot: free Kin, a free Connect, or years back.`]);
  }
  L.push(['A turn', `One of: <b>Pull ${SET.drawCount}</b>, <b>Connect a Kin</b>`
    + (SET.pairPlay ? ' (a married pair, or a parent and child, connect together for one turn)' : '')
    + (SET.drawBonus ? ', or <b>claim a Legacy card</b>' : '') + '.'
    + (SET.clockOn ? ` Costing <b>${SET.costDraw}</b>, <b>${SET.costPlay}</b>`
        + (SET.drawBonus?` and <b>${SET.costBonus}</b>`:'') + ' years.' : '')]);
  L.push(['Your hand', `You can hold <b>${SET.handLimit}</b> Kin. Pull past that and you `
    + 'return some to the Archive. A full hand costs you.']);
  L.push(['It ends', SET.clockOn
    ? `when the marker runs off the end — <b>${clockSpan[1]-clockSpan[0]}</b> years`
      + ((SET.clockDir==='forwardback'||SET.clockDir==='backwardforward') ? ' each way' : '')
      + ', or when the Archive and your hand are both empty.'
    : 'when the Archive and your hand are both empty.']);
  if(SET.difficulty==='hard')
    L.push(['Harder', 'Kin do <b>not</b> tell you what they are worth. You work it out.']);
  else if(SET.difficulty==='brutal')
    L.push(['Hardest', 'Nothing tells you what it is worth, and <b>no running Legacy</b>. '
      + 'You find out at the end.']);
  L.push(['On the timeline', TOUCH
    ? 'Tap a Kin to see their life, tap again for everything. <b>Press and hold a Kin, '
      + 'then drag it onto another</b> to trace the line between them.'
    : 'Hover a Kin to see their life. <b>Drag one Kin onto another</b> '
      + 'to trace the line between them.']);
  return L;
}

/* Poker mode: turn the next bonus face up once its turn arrives. Called from
   endCheck, so a flip lands whether the turn was a play, a draw or a bonus. */
function pokerCheck(){
  let flipped=null;
  while(pending.length && turn>=pending[0].turn){
    const f=pending.shift();
    bonuses.push({id:f.id, mult:f.mult, flip:true});
    flipped=f;
  }
  if(flipped){
    const b=BONUS_BY_ID[flipped.id];
    toast(`${pending.length?'A new Legacy card':'The last Legacy card'}: ${b.name}`
          +(flipped.mult>1?' — worth double':''));
  }
}

/* ---- the bonus draft --------------------------------------------------
   Deal BONUS_DEAL, keep BONUS_KEEP. "Show all" lifts both limits, which is
   what you want when you are exploring the set rather than playing a game. */
function openBonuses(){ $('#bmodal').classList.add('on'); renderBonusPicker(); }
/* The draft is a decision, not a dialog you can dismiss: clicking the backdrop
   or hitting Escape with only one of two picked used to leave you in a game
   with a half-finished draft AND a stale sidebar, because nothing re-rendered
   on the way out. Both paths go through here, and neither can leave early. */
function draftDone(){
  if(takeMode) return false;          // a take is committed by picking, not by OK
  const n=held().length;
  return pickAll ? n>0 : n===Math.min(SET.keep, draftPool(SET).length);
}
function closeBonuses(){
  if(!draftDone()) return false;
  $('#bmodal').classList.remove('on');
  render();
  dealOpening();          // no-op once the round has been dealt
  return true;
}

function renderBonusPicker(){

    <div class="brow">

        : `<label><input type="checkbox" id="ball" ${pickAll ? 'checked' : ''}> show all
             ${draftPool(SET).length}</label>
           <span class="sp"></span>

      // In a real draft the keep-count is the constraint; the oldest pick drops
      // out, so clicking a third card swaps rather than doing nothing at all.
      else {
