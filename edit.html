<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kinspan">
<meta name="theme-color" content="#f7f4ef">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="touch-icon.png">
<title>Kinspan — card builder</title>
<script src="tree.js?v=18"></script>
<script src="family.js?v=18"></script>
<script src="rules.js?v=18"></script>
<style>
  :root{
    --bg:#f7f4ef; --panel:#ffffff; --edge:#ddd5c9; --ink:#2b2621; --dim:#7d7368;
    --gold:#9a7212; --pat:#2f6f9e; --mat:#a8552a; --self:#2f7a45; --bad:#a4262c;
    --patbg:#e4f0f8; --matbg:#fbeade; --selfbg:#e2f3e6;
    --ease:cubic-bezier(.34,1.24,.44,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);height:100dvh;
    display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}

  header{flex:none;display:flex;gap:10px;align-items:center;
    padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
    background:var(--panel);border-bottom:1px solid var(--edge)}
  .hmark{font-size:20px}
  header h1{margin:0;font-size:18px;font-weight:680;letter-spacing:-.01em}
  .sp{flex:1}
  .round{border:1px solid var(--edge);background:var(--panel);border-radius:99px;
    width:40px;height:40px;font-size:18px;flex:none}
  .round:hover{border-color:var(--ink)}
  .btn{appearance:none;border:1px solid var(--edge);background:var(--panel);
    font-size:14px;font-weight:620;border-radius:10px;padding:8px 14px;min-height:40px}
  .btn:hover{border-color:var(--ink)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
  .btn.danger{color:var(--bad);border-color:#e7c9c9}
  .btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px}
  .dirty{width:8px;height:8px;border-radius:50%;background:var(--gold)}

  /* ---- toolbar ---- */
  .tools{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:12px 14px 4px;max-width:1100px;width:100%;margin:0 auto}
  #q{flex:1 1 180px;padding:9px 12px;border:1px solid var(--edge);border-radius:99px;
    font:inherit;font-size:15px;background:var(--panel);color:var(--ink)}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .chip{border:1px solid var(--edge);background:var(--panel);border-radius:99px;
    padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  #sort{width:auto;border:1px solid var(--edge);border-radius:99px;padding:7px 10px;font:inherit;
    font-size:13px;background:var(--panel);color:var(--ink)}

  /* ---- the deck ---- */
  main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
    padding:10px 14px calc(30px + env(safe-area-inset-bottom))}
  /* The deck: each Kin as the very card they play as. */
  #grid{--cw:200px;--ch:290px;align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;
    max-width:1100px;margin:0 auto;perspective:900px}
  @keyframes deal{from{opacity:0;transform:translateY(24px) rotate(-3deg) scale(.92)}to{opacity:1;transform:none}}
  .cell{display:block;width:100%;border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:400;
    animation:deal .42s var(--ease) both;transition:transform .2s var(--ease)}
  #grid.quiet .cell{animation:none}
  .cell:hover{transform:translateY(-6px) rotate(-1deg)}
  .cell:hover .face{box-shadow:0 16px 30px rgba(80,60,30,.2)}
  .cell .hc.noyear{opacity:.55}
  .cell.add{min-height:290px;border:2px dashed var(--edge);border-radius:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;color:var(--dim);font-weight:620}
  .cell.add b{font-size:34px;font-weight:300;line-height:1}
  .cell.add:hover{border-color:var(--ink);color:var(--ink)}
  .fx>.big{--ch:330px;width:224px;zoom:1.25;flex:none;animation:flip .5s var(--ease) both}
  .fx>.big .face{box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .fx.still>.big,.fx.still>.panel{animation:none}
  .count{max-width:1100px;margin:0 auto 10px;color:var(--dim);font-size:12.5px}
  .empty{color:var(--dim);text-align:center;padding:34px 0;grid-column:1/-1}

  /* ---- one card, up close ---- */
  #focus{position:fixed;inset:0;z-index:40;background:rgba(43,38,33,.5);display:none;
    align-items:center;justify-content:center;padding:16px}
  #focus.on{display:flex;animation:fade .2s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .fx{display:flex;gap:22px;align-items:flex-start;width:100%;max-width:860px;max-height:100%}
  @keyframes flip{from{transform:rotateY(80deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
  .panel{flex:1;min-width:0;background:var(--panel);border-radius:18px;padding:18px;
    max-height:calc(100dvh - 32px);overflow:auto;animation:slide .4s var(--ease) .08s both}
  @keyframes slide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
  .panel h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
    font-weight:680;margin:18px 0 8px}
  .panel h2:first-child{margin-top:0}

  .slot{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px;margin-bottom:8px;
    background:var(--tint);border:1.5px solid var(--tintedge);animation:deal .35s var(--ease) both}
  .slot .gi{font-size:24px;width:32px;text-align:center;color:var(--gold);flex:none;line-height:34px}
  .slot .grow{flex:1;min-width:0}
  .slot input{width:100%;border:0;background:transparent;font:inherit;color:var(--ink);padding:2px 0}
  .slot input:focus{outline:0;border-bottom:1px solid var(--tintedge)}
  .slot .gname{font-weight:680;color:var(--gold);font-size:16px}
  .slot .gfx{font-size:13px;color:#4d4d4d;margin:1px 0 3px}
  .slot .gwhy{font-size:13px;font-style:italic;color:var(--dim)}
  .addslot{width:100%;border:1.5px dashed var(--edge);background:transparent;border-radius:12px;
    padding:13px;color:var(--dim);font-weight:620;margin-bottom:8px}
  .addslot:hover{border-color:var(--gold);color:var(--gold)}
  .picker{border:1px solid var(--edge);border-radius:12px;padding:10px;margin-bottom:8px;
    animation:deal .3s var(--ease) both}
  .gg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
  .gg>span{flex-basis:100%;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .gg>span{grid-column:1/-1}
  .gchip{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--edge);
    background:var(--panel);border-radius:10px;padding:8px 10px;font-size:13px;
    transition:transform .12s var(--ease),border-color .12s}
  .gchip i{font-style:normal;color:var(--gold);font-size:17px;width:20px;text-align:center;flex:none}
  .gchip b{display:block;font-weight:650}
  .gchip small{display:block;color:var(--dim);font-size:11.5px;line-height:1.35}
  .gchip:hover{border-color:var(--gold);transform:translateY(-1px)}
  .gchip.sug{border-color:var(--gold);background:var(--tint);color:var(--gold);font-weight:650}
  textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--edge);border-radius:10px;
    font:inherit;font-size:15px;line-height:1.5;resize:vertical;background:var(--panel);color:var(--ink)}
  .done{display:flex;gap:8px;margin-top:16px}

  details.rec{margin-top:16px;border-top:1px solid var(--edge);padding-top:10px}
  details.rec summary{cursor:pointer;color:var(--dim);font-weight:620;font-size:14px;padding:6px 0}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:3px}
  input[type=text],input[type=number],select,#pq{
    width:100%;padding:9px 11px;border:1px solid var(--edge);border-radius:8px;
    font:inherit;font-size:16px;background:var(--panel);color:var(--ink)}
  .slot input[type=text]{border:0;padding:2px 0;font-size:inherit;background:transparent}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .check{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px}
  .check input{width:18px;height:18px}
  .hint{color:var(--dim);font-size:12.5px;margin:4px 0 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .link{display:flex;gap:8px;align-items:center;border:1px solid var(--edge);border-radius:9px;
    padding:7px 10px;margin-bottom:6px}
  .link .grow{flex:1;min-width:0}
  .link .n{font-weight:600;font-size:14px}
  .link .d{color:var(--dim);font-size:12px}
  .x{border:0;background:transparent;color:var(--dim);font-size:17px;padding:4px 7px;line-height:1;border-radius:6px}
  .x:hover{color:var(--bad);background:#faf0f0}
  .person{display:flex;gap:10px;align-items:center;width:100%;text-align:left;
    background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:10px 12px;margin-bottom:7px}
  .person:hover{border-color:var(--ink)}
  .person .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim)}
  .person .dot.m{background:var(--pat)} .person .dot.f{background:var(--mat)}
  .person .grow{flex:1;min-width:0}
  .person .n{font-weight:600}
  .person .d{color:var(--dim);font-size:12.5px}
  .tag{font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:650;
    border-radius:99px;padding:2px 7px;background:#eef4ee;color:var(--self)}

  #modal{position:fixed;inset:0;background:rgba(43,38,33,.4);display:none;z-index:50;
    align-items:flex-end;justify-content:center}
  #modal.on{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:520px;border-radius:16px 16px 0 0;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;
    animation:deal .3s var(--ease) both}
  .sheet h2{font-size:18px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(22px + env(safe-area-inset-bottom));z-index:60;
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;
    font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.on{opacity:1}

  @media (min-width:560px){ #modal{align-items:center} .sheet{border-radius:16px} }
  @media (max-width:640px){
    #focus{padding:0;align-items:stretch}
    .fx{flex-direction:column;align-items:stretch;gap:0;overflow:auto;max-height:none;min-height:100%;
      padding:14px 12px calc(16px + env(safe-area-inset-bottom))}
    .panel{flex:1;max-height:none;overflow:visible;padding-top:34px}
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
<link rel="stylesheet" href="theme.css?v=18">

<header>
  <button class="round" id="home" aria-label="Main menu"><i data-ic="back"></i></button>
  <span class="hmark" data-logo></span>
  <h1>Card builder</h1>
  <div class="sp"></div>
  <span class="dirty" id="dirty" title="Changes not saved to your file" hidden></span>
  <button class="btn gold" id="save">Save file</button>
</header>

<div class="tools">
  <input id="q" type="search" placeholder="Find someone" autocomplete="off">
  <div class="chips" id="chips"></div>
  <select id="sort" aria-label="Sort">
    <option value="old">Oldest first</option>
    <option value="young">Youngest first</option>
    <option value="az">A to Z</option>
  </select>
</div>

<main>
  <p class="count" id="count"></p>
  <div id="grid"></div>
</main>

<div id="focus"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let fam = null;
let editing = null;      // id of the card open up close
let picking = false;     // the Gift menu is open on that card
let filter = 'all';
let shown = null;     // the card already flipped open, so a redraw does not flip it again

(async function () {
  fam = await FAMILY.load();
  if (!fam) { location.href = './'; return; }
  render();
})();

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200);
}

/* Any change goes through here: re-derive, re-render, mark unsaved. */
function changed(msg) {
  fam = FAMILY.touched();
  if (msg) toast(msg);
  render();
}

let drawn = false;   // the deck deals in once, then redraws quietly
function render() {
  $('#dirty').hidden = !fam.dirty;
  if (editing && !fam.byId[editing]) editing = null;
  renderGrid(drawn); drawn = true;
  renderFocus();
}

/* ------------------------------------------------------------- a card ---- */

const sideOf = p => p.relationship_to_root === 'self' ? 'self'
  : p.relationship_side === 'maternal' ? 'mat' : 'pat';
const initials = p => ((p.given || p.name || '?')[0] + ((p.surname || '')[0] || '')).toUpperCase();
const years = p => p.birth_year ? `${p.birth_year}–${p.living ? 'now' : (p.death_year || '?')}` : 'No birth year';
const TIER = ['Sketch', 'Story', 'Biography'];

/* The builder shows each Kin as the card they play as. A Gift written here
 * makes them a Biography every game, so they show in gold; anyone else is
 * dealt a tier each game and shows plain. */
const writtenRarity = p => { const a = (p.abilities||[]).find(a => a && a.name);
  return !a ? '' : a.tier === 'low' ? 'r-rare' : 'r-legend'; };
function gridCard(p, i) {
  return `<button class="cell" data-id="${esc(p.id)}" style="animation-delay:${Math.min(i, 24) * 22}ms">${
    kinCard(p, { rarity: writtenRarity(p), cls: p.birth_year ? '' : 'noyear' })}</button>`;
}

/* ------------------------------------------------------------- the deck -- */

const FILTERS = [
  ['all', 'Everyone', () => true],
  ['gift', 'With Gifts', p => (p.abilities || []).length],
  ['none', 'No Gift yet', p => !(p.abilities || []).length],
  ['pat', "Father's side", p => sideOf(p) === 'pat'],
  ['mat', "Mother's side", p => sideOf(p) === 'mat'],
];
const SORTS = {
  old: (a, b) => (a.birth_year || 9999) - (b.birth_year || 9999),
  young: (a, b) => (b.birth_year || 0) - (a.birth_year || 0),
  az: (a, b) => a.name.localeCompare(b.name),
};
$('#chips').innerHTML = FILTERS.map(([id, label]) =>
  `<button class="chip ${id === filter ? 'on' : ''}" data-f="${id}">${label}</button>`).join('');
$('#chips').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f;
  $('#chips').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
  renderGrid(); };
$('#q').oninput = () => renderGrid();
$('#sort').onchange = () => renderGrid();

function renderGrid(quiet) {
  $('#grid').classList.toggle('quiet', !!quiet);
  const term = ($('#q').value || '').trim().toLowerCase();
  const keep = FILTERS.find(f => f[0] === filter)[2];
  const list = fam.people.filter(p => keep(p) && (!term || p.name.toLowerCase().includes(term)))
    .sort(SORTS[$('#sort').value]);
  const gifted = fam.people.filter(p => (p.abilities || []).length).length;
  $('#count').textContent = `${fam.people.length} Kin · ${gifted} with a Gift`
    + (list.length !== fam.people.length ? ` · showing ${list.length}` : '');
  $('#grid').innerHTML = (list.length ? list.map(gridCard).join('') : '<p class="empty">Nobody here.</p>')
    + `<button class="cell add" id="add"><b>${icon('plus')}</b>Add someone</button>`;
  $('#grid').querySelectorAll('.cell').forEach(b => {
    b.onclick = () => { editing = b.dataset.id; picking = false; renderFocus(); };
  });
  $('#add').onclick = () => newPerson(null, null);
}

/* ------------------------------------------------------ one card, up close */

function renderFocus() {
  const f = $('#focus');
  const p = editing && fam.byId[editing];
  if (!p) { f.classList.remove('on'); f.innerHTML = ''; shown = null; return; }
  const ab = p.abilities || [];
  const sug = suggestGift(p, giftContext(fam.people));
  const isRoot = fam.meta.root_id === p.id;
  const chip = (id, hot) => { const g = GIFT_BY_ID[id], fx = ABILITY_EFFECTS[g.kind];
    return `<button class="gchip ${hot ? 'sug' : ''}" data-gift="${id}"
      ><i>${fx.icon}</i><span><b>${esc(g.name)}</b><small>${esc(giftTier(g.kind, 'high').effect)} ≈ ${giftTier(g.kind, 'high').worth} Legacy</small></span></button>`; };
  const taken = new Set(ab.map(a => a.gift));

  const slots = ab.map((a, i) => {
    // A Gift written before the menu has no effect of its own; in play it
    // borrows the one their life suggests, so say that rather than nothing.
    const own = ABILITY_EFFECTS[a.kind], fx = own || ABILITY_EFFECTS[(sug || {}).kind];
    return `<div class="slot">
      <span class="gi">${fx ? fx.icon : icon('spark')}</span>
      <div class="grow">
        <input type="text" class="gname" id="f-gn${i}" value="${esc(a.name)}" aria-label="Gift name">
        <div class="gfx">${fx ? esc(giftTier(own ? a.kind : sug.kind, 'high').effect) : ''}</div>
        <input type="text" class="gwhy" id="f-gw${i}" value="${esc(a.why || a.text || '')}"
          placeholder="Why them? A line from their story" aria-label="Why they have it">
      </div>
      <button class="x" data-ungift="${i}" aria-label="Remove this Gift">${icon('close')}</button>
    </div>`; }).join('');
  const add = ab.length >= 1 ? '' : picking ? `<div class="picker">
      ${sug && !taken.has(sug.gift) ? `<div class="gg"><span>Their life suggests</span>${chip(sug.gift, true)}</div>` : ''}
      ${[...new Set(GIFTS.map(g => g.group))].map(grp => `<div class="gg"><span>${esc(grp)}</span>${
        GIFTS.filter(g => g.group === grp && !taken.has(g.id)).map(g => chip(g.id)).join('')}</div>`).join('')}
      <button class="btn sm" id="unpick">Close</button></div>`
    : `<button class="addslot" id="pick">${icon('plus')} Add a Gift${sug && !taken.has(sug.gift) ? ` · try <b>${esc(GIFT_BY_ID[sug.gift].name)}</b>` : ''}</button>`;

  f.innerHTML = `<div class="fx ${shown === p.id ? 'still' : ''}">
    <div class="big">${kinCard(p, { rarity: writtenRarity(p) })}</div>
    <div class="panel">
      <h2>Gift</h2>
      <p class="hint" style="margin:-4px 0 10px">${ab.length ? 'A Gift you write plays at full strength: this card is a Biography every game.'
        : 'Without one, each game deals this Kin as a Sketch, a Story, or a Biography at random. Write one and they are always a Biography.'}</p>
      ${slots}${add}
      <h2>Their story</h2>
      <textarea id="f-story" placeholder="A job, a journey, something they said, how they are remembered.">${esc(p.story || '')}</textarea>

      <details class="rec"><summary>Fix the record</summary>
        <div class="two" style="margin-top:8px">
          <div class="field"><label>First names</label><input type="text" id="f-given" value="${esc(p.given||'')}"></div>
          <div class="field"><label>Surname</label><input type="text" id="f-surname" value="${esc(p.surname||'')}"></div>
        </div>
        <div class="two">
          <div class="field"><label>Suffix</label><input type="text" id="f-suffix" value="${esc(p.suffix||'')}" placeholder="Jr, III"></div>
          <div class="field"><label>Sex</label><select id="f-sex">
            <option value=""${!p.sex?' selected':''}>Not recorded</option>
            <option value="F"${p.sex==='F'?' selected':''}>Female</option>
            <option value="M"${p.sex==='M'?' selected':''}>Male</option></select></div>
        </div>
        <div class="two">
          <div class="field"><label>Born — year</label><input type="number" id="f-by" value="${p.birth_year ?? ''}" placeholder="1902"></div>
          <div class="field"><label>Born — place</label><input type="text" id="f-bp" value="${esc(p.birth_place||'')}"></div>
        </div>
        <div class="check"><input type="checkbox" id="f-living" ${p.living?'checked':''}>
          <label for="f-living">Still living</label></div>
        <div id="deathfields" ${p.living?'hidden':''}>
          <div class="two">
            <div class="field"><label>Died — year</label><input type="number" id="f-dy" value="${p.death_year ?? ''}"></div>
            <div class="field"><label>Died — place</label><input type="text" id="f-dp" value="${esc(p.death_place||'')}"></div>
          </div>
          <div class="field"><label>Buried</label><input type="text" id="f-bu" value="${esc(p.burial_place||'')}"></div>
        </div>
        <div class="field"><label>Children they had</label>
          <input type="number" id="f-kids" value="${p.child_count ?? ''}" placeholder="${p.children_in_tree} in this file"></div>
        ${renderMarriages(p)}
        ${linkBlock('Parents', p.parent_ids, 'parent')}
        ${linkBlock('Spouses', p.spouse_ids, 'spouse')}
        ${linkBlock('Children', p.children_ids, 'child')}
        <div class="row" style="margin-top:12px">
          ${isRoot ? '<span class="tag">Everyone is related to them</span>'
                   : '<button class="btn sm" id="mkroot">Centre the family on them</button>'}
          <div class="sp"></div>
          <button class="btn sm danger" id="del">Remove</button>
        </div>
      </details>

      <div class="done"><div class="sp"></div><button class="btn primary" id="apply">Done</button></div>
    </div></div>`;
  f.classList.add('on'); shown = p.id;

  const close = () => { commit(); editing = null; render(); };
  $('#apply').onclick = close;
  f.onclick = e => { if (e.target === f || e.target.classList.contains('fx')) close(); };
  const pk = $('#pick'); if (pk) pk.onclick = () => { commit(); picking = true; renderFocus(); };
  const up = $('#unpick'); if (up) up.onclick = () => { commit(); picking = false; renderFocus(); };
  const mk = $('#mkroot');
  if (mk) mk.onclick = () => { commit(); fam.meta.root_id = p.id;
    changed(`Everyone is now described relative to ${p.name}.`); };
  $('#f-living').onchange = e => { $('#deathfields').hidden = e.target.checked; };
  $('#del').onclick = () => confirmDelete(p);
  f.querySelectorAll('[data-gift]').forEach(b => {
    b.onclick = () => {
      commit();
      const id = b.dataset.gift, g = GIFT_BY_ID[id];
      p.abilities.push({ gift: id, kind: g.kind, n: g.n || 1, name: g.name, why: '' });
      picking = false;
      changed(`${g.name} given to ${p.given || p.name}.`);
    };
  });
  f.querySelectorAll('[data-ungift]').forEach(b => {
    b.onclick = () => { commit(); p.abilities.splice(+b.dataset.ungift, 1); changed(); };
  });
  f.querySelectorAll('[data-unlink]').forEach(b => {
    b.onclick = () => {
      commit();
      const [kind, other] = b.dataset.unlink.split(':');
      if (kind === 'spouse') TREE.unlinkSpouse(fam.byId, p.id, other);
      if (kind === 'parent') TREE.unlinkChild(fam.byId, other, p.id);
      if (kind === 'child')  TREE.unlinkChild(fam.byId, p.id, other);
      changed('Unlinked.');
    };
  });
  f.querySelectorAll('[data-addlink]').forEach(b => {
    b.onclick = () => { commit(); pickPerson(p, b.dataset.addlink); };
  });
}

function renderMarriages(p) {
  const mars = (p.marriages || []).filter(m => m.spouse_id);
  if (!mars.length) return '';
  return `<h2>Marriages</h2><div class="card">` + mars.map((m, i) => `
    <div class="field">
      <label>${esc(m.spouse_name || 'Spouse')}</label>
      <div class="two">
        <input type="number" id="f-my${i}" value="${m.year ?? ''}" placeholder="Year">
        <input type="text" id="f-mp${i}" value="${esc(m.place||'')}" placeholder="Place">
      </div>
    </div>`).join('') + `</div>`;
}

function linkBlock(title, ids, kind) {
  const rows = (ids || []).map(id => {
    const q = fam.byId[id];
    if (!q) return '';
    const yrs = q.birth_year ? `b. ${q.birth_year}` : 'no dates';
    return `<div class="link">
      <span class="dot ${q.sex==='M'?'m':q.sex==='F'?'f':''}"
        style="width:8px;height:8px;border-radius:50%;background:${q.sex==='M'?'var(--pat)':q.sex==='F'?'var(--mat)':'var(--dim)'}"></span>
      <span class="grow"><span class="n">${esc(q.name)}</span>
        <span class="d"> · ${esc(yrs)}</span></span>
      <button class="x" data-unlink="${kind}:${esc(id)}" title="Unlink">${icon('close')}</button>
    </div>`;
  }).join('');
  return `<div style="margin-bottom:12px">
    <label style="display:block;font-size:12.5px;color:var(--dim);margin-bottom:5px">${title}</label>
    ${rows || '<p class="hint" style="margin:0 0 6px">None recorded.</p>'}
    <button class="btn sm" data-addlink="${kind}">Add a ${kind}</button>
  </div>`;
}

/* Read every field back onto the person. Called before any action that
 * re-renders, so nothing typed is silently thrown away. */
function commit() {
  const p = fam.byId[editing];
  if (!p) return;
  const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const num = id => { const v = val(id); if (v === '') return null;
                      const n = parseInt(v, 10); return Number.isFinite(n) ? n : null; };
  const chk = id => { const e = document.getElementById(id); return e ? e.checked : false; };

  p.given = val('f-given') || null;
  p.surname = val('f-surname') || null;
  p.suffix = val('f-suffix') || null;
  p.sex = val('f-sex') || null;

  p.birth_year = num('f-by');
  p.birth_place = val('f-bp') || null;
  p.living = chk('f-living');
  if (p.living) {
    p.death_year = null; p.death_place = null; p.burial_place = null;
  } else {
    p.death_year = num('f-dy');
    p.death_place = val('f-dp') || null;
    p.burial_place = val('f-bu') || null;
  }
  p.child_count = num('f-kids');

  (p.marriages || []).filter(m => m.spouse_id).forEach((m, i) => {
    if (document.getElementById('f-my' + i)) {
      m.year = num('f-my' + i);
      m.place = val('f-mp' + i) || null;
    }
  });

  p.story = (document.getElementById('f-story') || {}).value || '';
  // The Gift list is the truth; the inputs only rename it or add a why. An
  // emptied name falls back to the catalogue's, so a Gift is never lost to a
  // cleared box. `text` was the why before the menu; it becomes `why` here.
  p.abilities = (p.abilities || []).map(({ text, ...a }, i) => ({ ...a,
    name: val('f-gn' + i) || (GIFT_BY_ID[a.gift] || {}).name || a.name,
    why: document.getElementById('f-gw' + i) ? val('f-gw' + i) : (a.why || text || '') }));
  // A person who has been written about is no longer untouched.
  if ((p.story || '').trim() || p.abilities.length) p.status = 'drafted';

  fam = FAMILY.touched();
}

/* ------------------------------------------------------- pick a person ---- */

function pickPerson(p, kind) {
  const banned = new Set([p.id]);
  const already = kind === 'spouse' ? p.spouse_ids
                : kind === 'parent' ? p.parent_ids : p.children_ids;
  (already || []).forEach(i => banned.add(i));

  const choices = fam.people.filter(q => {
    if (banned.has(q.id)) return false;
    // Refuse anything that would make someone their own ancestor.
    if (kind === 'parent' && TREE.isAncestorOf(fam.byId, p.id, q.id)) return false;
    if (kind === 'child' && TREE.isAncestorOf(fam.byId, q.id, p.id)) return false;
    return true;
  });

  openSheet(`
    <h2 style="margin-top:0">Add a ${kind} for ${esc(p.name)}</h2>
    <input id="pq" type="search" placeholder="Search" autocomplete="off"
      style="width:100%;padding:10px 12px;border:1px solid var(--edge);border-radius:9px;
             font:inherit;font-size:16px;margin-bottom:9px">
    <div id="plist" style="max-height:46vh;overflow:auto"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="pnew">They are not here — add them</button>
      <div style="flex:1"></div>
      <button class="btn" id="pcancel">Cancel</button>
    </div>
  `);

  const draw = term => {
    const t = (term || '').trim().toLowerCase();
    const list = choices.filter(q => !t || q.name.toLowerCase().includes(t)).slice(0, 80);
    $('#plist').innerHTML = list.length ? list.map(q => `
      <button class="person" data-id="${esc(q.id)}">
        <span class="dot ${q.sex==='M'?'m':q.sex==='F'?'f':''}"></span>
        <span class="grow"><span class="n">${esc(q.name)}</span>
          <span class="d">${q.birth_year ? 'b. '+q.birth_year : 'no dates'}</span></span>
      </button>`).join('')
      : '<p class="empty">Nobody available.</p>';
    $('#plist').querySelectorAll('.person').forEach(b => {
      b.onclick = () => { doLink(p, kind, b.dataset.id); closeSheet(); };
    });
  };
  draw('');
  $('#pq').oninput = e => draw(e.target.value);
  $('#pcancel').onclick = closeSheet;
  $('#pnew').onclick = () => { closeSheet(); newPerson(p, kind); };
}

function doLink(p, kind, otherId) {
  let ok = false;
  if (kind === 'spouse') ok = TREE.linkSpouse(fam.byId, p.id, otherId);
  if (kind === 'parent') ok = TREE.linkChild(fam.byId, otherId, p.id);
  if (kind === 'child')  ok = TREE.linkChild(fam.byId, p.id, otherId);
  if (!ok) return toast('That link would put someone in their own family line.');
  changed(`Linked ${fam.byId[otherId].name}.`);
}

/* ---------------------------------------------------------- add someone ---- */

function newPerson(relativeTo, kind) {
  openSheet(`
    <h2 style="margin-top:0">Add someone${relativeTo ? ` as a ${kind} of ${esc(relativeTo.name)}` : ''}</h2>
    <div class="two">
      <div class="field"><label>First names</label><input type="text" id="n-given" autofocus></div>
      <div class="field"><label>Surname</label><input type="text" id="n-surname"></div>
    </div>
    <div class="two">
      <div class="field"><label>Born — year</label><input type="number" id="n-by" placeholder="1902"></div>
      <div class="field"><label>Sex</label>
        <select id="n-sex"><option value="">Not recorded</option>
          <option value="F">Female</option><option value="M">Male</option></select></div>
    </div>
    <div class="field"><label>Born — place</label><input type="text" id="n-bp"></div>
    <div class="check"><input type="checkbox" id="n-living">
      <label for="n-living" style="margin:0">Still living</label></div>
    <p class="hint">You can fill in the rest afterwards. A birth year is what lets
      them be played.</p>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="ncreate">Add them</button>
      <div style="flex:1"></div>
      <button class="btn" id="ncancel">Cancel</button>
    </div>
  `);
  $('#ncancel').onclick = closeSheet;
  $('#ncreate').onclick = () => {
    const g = $('#n-given').value.trim(), s = $('#n-surname').value.trim();
    if (!g && !s) return toast('Give them at least one name.');
    const by = parseInt($('#n-by').value, 10);
    const p = TREE.addPerson(fam.people, {
      given: g || null, surname: s || null,
      sex: $('#n-sex').value || null,
      birth_year: Number.isFinite(by) ? by : null,
      birth_place: $('#n-bp').value.trim() || null,
      living: $('#n-living').checked,
    });
    fam.byId[p.id] = p;
    if (relativeTo) {
      if (kind === 'spouse') TREE.linkSpouse(fam.byId, relativeTo.id, p.id);
      if (kind === 'parent') TREE.linkChild(fam.byId, p.id, relativeTo.id);
      if (kind === 'child')  TREE.linkChild(fam.byId, relativeTo.id, p.id);
    }
    closeSheet();
    if (!relativeTo) editing = p.id;
    changed(`${p.name} added.`);
  };
}


/* ------------------------------------------------------------- removing ---- */

function confirmDelete(p) {
  const isRoot = fam.meta.root_id === p.id;
  openSheet(`
    <h2 style="margin-top:0">Remove ${esc(p.name)}?</h2>
    <p>They will be taken out of your family file, along with every link to them.
      ${isRoot ? '<b>They are who this family is centred on</b> — everyone else’s '
               + 'relationship will be recalculated from whoever comes first.' : ''}</p>
    <p class="hint">This only changes your file. Nothing anywhere else is touched,
      and you can always reload your last saved file.</p>
    <div class="row" style="margin-top:14px">
      <button class="btn danger" id="dyes">Remove them</button>
      <div style="flex:1"></div>
      <button class="btn" id="dno">Keep them</button>
    </div>
  `);
  $('#dno').onclick = closeSheet;
  $('#dyes').onclick = () => {
    const name = p.name;
    TREE.removePerson(fam.people, p.id);
    delete fam.byId[p.id];
    if (fam.meta.root_id === p.id) fam.meta.root_id = fam.people.length ? fam.people[0].id : null;
    editing = null;
    closeSheet();
    changed(`${name} removed.`);
  };
}

/* ---------------------------------------------------------------- sheet ---- */

function openSheet(html) {
  $('#sheet').innerHTML = html;
  $('#modal').classList.add('on');
}
function closeSheet() { $('#modal').classList.remove('on'); $('#sheet').innerHTML = ''; }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeSheet(); };
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#modal').classList.contains('on')) closeSheet();
  else if (editing) { commit(); editing = null; render(); }
});

/* ----------------------------------------------------------------- save ---- */

$('#save').onclick = () => {
  if (editing) commit();
  const name = FAMILY.download(fam);
  render();
  toast(`Saved ${name}. Keep it somewhere safe.`);
};

/* ------------------------------------------------------------ the game ---- */

/* Back to the title screen. The autosave carries the family across, so this
 * is not a place to warn about unsaved changes. */
let leaving = false;
$('#home').onclick = () => {
  if (editing) commit();
  leaving = true;
  location.href = './';
};

/* The autosave is a crash net, not their file. Say so on the way out rather
 * than letting someone assume an hour of writing is safely stored -- but not
 * when they are only stepping over to the board, which carries the same
 * unsaved family with it and comes straight back here. */
window.addEventListener('beforeunload', e => {
  if (leaving) return;
  if (fam && fam.dirty) { e.preventDefault(); e.returnValue = ''; }
});
</script>
