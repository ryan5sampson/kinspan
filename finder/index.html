<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activity finder prototype</title>
<script src="data.js"></script>
<style>
  /* ---------- Colors: change --accent to rebrand ---------- */
  :root {
    --accent: #1d6fa5;
    --accent-soft: #e6f1f8;
    --ink: #1c2530;
    --muted: #66717d;
    --line: #e7eaee;
    --bg: #ffffff;
    --quiet: #1f9d55;    --quiet-bg: #e3f6ea;
    --moderate: #b7791f; --moderate-bg: #fdf3d8;
    --busy: #d64545;     --busy-bg: #fde6e6;
    --closed: #8a94a0;   --closed-bg: #eef0f2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- Phone frame: full screen on phones, framed on laptops ---------- */
  #app {
    position: relative; display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden; background: var(--bg);
  }
  @media (min-width: 500px) {
    body { background: #dfe5ea; display: grid; place-items: center; }
    #app { width: 390px; height: min(844px, calc(100vh - 40px));
           border-radius: 36px; box-shadow: 0 20px 60px rgba(0,0,0,.18); }
  }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  }
  .logo {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: var(--accent); color: #fff; font-weight: 800;
    display: grid; place-items: center;
  }
  .brand { font-weight: 700; }
  .pill {
    font-size: 11px; font-weight: 600; color: var(--muted);
    background: var(--closed-bg); border-radius: 99px; padding: 3px 8px;
  }
  .reset {
    margin-left: auto; background: none; border: 0; padding: 8px 4px;
    color: var(--muted); font-size: 13px; text-decoration: underline;
  }

  main { flex: 1; overflow-y: auto; padding: 16px 16px 24px; }
  h1 { font-size: 24px; margin: 4px 0 4px; }
  h2 { font-size: 17px; margin: 22px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 16px; }

  /* ---------- Buttons ---------- */
  .btn {
    display: block; width: 100%; min-height: 50px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 16px;
  }
  .btn:disabled { background: var(--closed-bg); color: var(--closed); cursor: default; }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }
  .btn.small { display: inline-block; width: auto; min-height: 40px; padding: 0 16px; font-size: 14px; }

  /* ---------- Intro chips ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .chip {
    display: flex; align-items: center; gap: 10px; text-align: left;
    min-height: 64px; padding: 10px 12px; border-radius: 16px;
    border: 2px solid var(--line); background: #fff; font-weight: 600; font-size: 14px;
  }
  .chip .ico { font-size: 26px; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .stick { position: sticky; bottom: 0; padding-top: 8px; background: linear-gradient(transparent, #fff 30%); }

  /* ---------- Busyness badge: color is always paired with a text label ---------- */
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700;
           border-radius: 99px; padding: 3px 10px; }
  .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .quiet    { color: var(--quiet);    background: var(--quiet-bg); }
  .moderate { color: var(--moderate); background: var(--moderate-bg); }
  .busy     { color: var(--busy);     background: var(--busy-bg); }
  .closed   { color: var(--closed);   background: var(--closed-bg); }

  /* ---------- Home cards ---------- */
  .card {
    display: block; width: 100%; text-align: left; background: #fff;
    border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .grow { flex: 1; min-width: 0; }
  .card .ico { font-size: 30px; }
  .title { font-weight: 700; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .facts { display: grid; gap: 4px; margin-top: 10px; font-size: 14px; }
  .best { color: var(--accent); font-weight: 600; }

  .saved-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin: 0 -16px; padding-left: 16px; }
  .mini {
    flex: none; width: 140px; text-align: left; border: 1px solid var(--line);
    border-radius: 16px; background: #fff; padding: 12px;
  }
  .mini .ico { font-size: 24px; }
  .mini .title { font-size: 14px; margin: 4px 0 6px; }

  /* ---------- Discover deck ---------- */
  .deck { position: relative; height: 360px; margin-bottom: 16px; }
  .swipe {
    position: absolute; inset: 0; border-radius: 24px; overflow: hidden; background: #fff;
    border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.08);
    touch-action: none; user-select: none; transition: transform .25s;
  }
  .swipe.behind { transform: scale(.95) translateY(12px); }
  .swipe.dragging { transition: none; }
  .hero { height: 190px; display: grid; place-items: center; font-size: 84px; }
  .swipe .body { padding: 16px; }
  .swipe .title { font-size: 22px; }
  .pitch { margin: 10px 0 0; font-size: 15px; }
  .stamp { position: absolute; top: 18px; padding: 6px 12px; border: 3px solid; border-radius: 10px;
           font-weight: 800; font-size: 20px; opacity: 0; background: #fff; }
  .stamp.like { left: 18px; color: var(--quiet); transform: rotate(-12deg); }
  .stamp.nope { right: 18px; color: var(--busy); transform: rotate(12deg); }
  .actions { display: flex; justify-content: center; gap: 28px; }
  .round {
    width: 72px; height: 72px; border-radius: 50%; border: 2px solid var(--line);
    background: #fff; font-size: 30px; display: grid; place-items: center;
  }
  .round small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: -6px; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 12px; }

  /* ---------- Community ---------- */
  .filters { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 14px; padding: 2px 16px 6px; }
  .fchip {
    flex: none; min-height: 40px; padding: 0 14px; border-radius: 99px;
    border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: 14px;
  }
  .fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .join { min-width: 84px; }
  .join.joined { background: var(--quiet-bg); color: var(--quiet); }

  /* ---------- Bottom tab bar ---------- */
  nav { display: flex; border-top: 1px solid var(--line); background: #fff; padding-bottom: env(safe-area-inset-bottom); }
  nav[hidden] { display: none; }
  nav button {
    flex: 1; border: 0; background: none; padding: 8px 0 10px; color: var(--muted);
    font-size: 12px; font-weight: 600; border-top: 3px solid transparent;
  }
  nav button span { display: block; font-size: 26px; line-height: 1.2; filter: grayscale(1); opacity: .6; }
  nav button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
  nav button[aria-current="page"] span { filter: none; opacity: 1; }

  /* ---------- Bottom sheet (detail and form) ---------- */
  .scrim { position: absolute; inset: 0; background: rgba(20,30,40,.4); display: flex; align-items: flex-end; z-index: 10; }
  .sheet { width: 100%; max-height: 88%; overflow-y: auto; background: #fff; border-radius: 24px 24px 0 0; padding: 10px 16px 24px; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  .close { float: right; border: 0; background: var(--closed-bg); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 110px; margin-top: 8px; }
  .bar { flex: 1; border-radius: 4px 4px 0 0; min-height: 3px; position: relative; }
  .bar.now { outline: 2px solid var(--ink); outline-offset: 1px; }
  .bar.now::after { content: "Now"; position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
                    font-size: 11px; font-weight: 700; }
  .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .q { background: var(--quiet); } .m { background: #e0a72e; } .b { background: var(--busy); } .c { background: var(--closed-bg); }
  .info { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 16px 0; font-size: 15px; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; font-weight: 600; }
  .stack { display: grid; gap: 10px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 6px; }
  select, input { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: #fff; }

  /* ---------- Toast ---------- */
  #toast {
    position: absolute; left: 16px; right: 16px; bottom: 90px; z-index: 20;
    background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 16px;
    font-weight: 600; text-align: center; opacity: 0; transform: translateY(10px);
    transition: .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo" id="logo"></div>
    <span class="brand" id="brand"></span>
    <span class="pill">Sample data</span>
    <button class="reset" data-action="reset">Reset demo</button>
  </header>
  <main id="screen"></main>
  <nav id="tabs" hidden>
    <button data-action="tab" data-id="home"><span>🏠</span>Home</button>
    <button data-action="tab" data-id="discover"><span>🧭</span>Discover</button>
    <button data-action="tab" data-id="community"><span>👥</span>Community</button>
  </nav>
  <div id="sheet"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script>
// ============================================================
// Prototype logic. All content comes from data.js (window.DATA).
// Pattern: change state S, then call render(). Taps are handled by
// one click listener that reads data-action / data-id attributes.
// ============================================================
const D = window.DATA;
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const act = (id) => D.activities.find((a) => a.id === id);
const place = (id) => D.places.find((p) => p.id === id);

// ---------- In-memory state (reset with "Reset demo") ----------
let S;
function freshState() {
  return {
    tab: "intro",
    interests: new Set(),
    saved: [],              // place ids, newest first
    skipped: new Set(),     // place ids skipped in Discover
    groups: D.groups.map((g) => ({ ...g, joined: false })),
    filter: "all",          // Community activity filter
    placeFilter: null,      // Community place filter (from "See groups going")
  };
}

// ---------- Time and busyness ----------
const HOUR = D.demoHour ?? new Date().getHours();
const NOW = Math.min(14, Math.max(0, HOUR - 8));          // index into the 8 AM-10 PM series
const DAY = [0, 6].includes(new Date().getDay()) ? "weekend" : "weekday";
const series = (p) => D.profiles[p.profile][DAY];
const busyNow = (p) => series(p)[NOW];

function level(v) {
  if (v === 0) return { label: "Closed", cls: "closed", bar: "c" };
  if (v < 35) return { label: "Quiet", cls: "quiet", bar: "q" };
  if (v < 65) return { label: "Moderate", cls: "moderate", bar: "m" };
  return { label: "Busy", cls: "busy", bar: "b" };
}
const badge = (v) => { const l = level(v); return `<span class="badge ${l.cls}">${l.label}</span>`; };

const ampm = (h) => (h < 12 ? "AM" : "PM");
const h12 = (h) => ((h + 11) % 12) + 1;
// Quietest open hour from now until close, shown as a 2-hour window
// (or 1 hour if the place closes right after).
function bestTime(p) {
  const s = series(p);
  let best = -1;
  for (let i = NOW; i < s.length; i++) if (s[i] && (best < 0 || s[i] < s[best])) best = i;
  if (best < 0) return "Closed for today";
  const a = best + 8, b = a + (s[best + 1] ? 2 : 1);
  return ampm(a) === ampm(b) ? `${h12(a)}–${h12(b)} ${ampm(b)}` : `${h12(a)} ${ampm(a)}–${h12(b)} ${ampm(b)}`;
}

// Open places sorted quietest first; closed ones go last.
const byQuiet = (a, b) => (busyNow(a) || 999) - (busyNow(b) || 999);

// ---------- Screens ----------
function renderIntro() {
  const n = S.interests.size;
  return `
    <h1>What do you like to do?</h1>
    <p class="sub">Pick as many as you want. We'll find spots near you.</p>
    <div class="grid">
      ${D.activities.map((a) => `
        <button class="chip" data-action="interest" data-id="${a.id}" aria-pressed="${S.interests.has(a.id)}">
          <span class="ico">${a.icon}</span>${a.name}
        </button>`).join("")}
    </div>
    <div class="stick">
      <button class="btn" data-action="start" ${n ? "" : "disabled"}>
        ${n ? `Continue (${n} selected)` : "Pick at least one"}
      </button>
    </div>`;
}

function renderHome() {
  const picks = D.places.filter((p) => S.interests.has(p.activity)).sort(byQuiet);
  const quiet = picks.filter((p) => level(busyNow(p)).cls === "quiet").length;
  const greet = HOUR < 12 ? "Good morning" : HOUR < 18 ? "Good afternoon" : "Good evening";
  const saved = S.saved.map(place);
  return `
    <h1>${greet} 👋</h1>
    <p class="sub">${quiet} of your ${picks.length} spots ${quiet === 1 ? "is" : "are"} quiet right now</p>
    ${saved.length ? `
      <h2>Saved to try</h2>
      <div class="saved-row">
        ${saved.map((p) => `
          <button class="mini" data-action="detail" data-id="${p.id}">
            <div class="ico">${act(p.activity).icon}</div>
            <div class="title">${esc(p.name)}</div>
            ${badge(busyNow(p))}
          </button>`).join("")}
      </div>` : ""}
    <h2>Top picks right now</h2>
    ${picks.map((p) => `
      <button class="card" data-action="detail" data-id="${p.id}">
        <div class="row">
          <span class="ico">${act(p.activity).icon}</span>
          <div class="grow">
            <div class="title">${esc(p.name)}</div>
            <div class="meta">${act(p.activity).name} · ${p.miles} mi</div>
          </div>
          ${badge(busyNow(p))}
        </div>
        <div class="facts">
          <div>🌤️ ${esc(p.conditions)}</div>
          <div>💵 ${esc(p.price)}</div>
          <div class="best">⏰ Best time today: ${bestTime(p)}</div>
        </div>
      </button>`).join("")}`;
}

// Discover favors activities OUTSIDE your interests, then the rest.
function deck() {
  const left = D.places.filter((p) => !S.saved.includes(p.id) && !S.skipped.has(p.id));
  return [...left.filter((p) => !S.interests.has(p.activity)), ...left.filter((p) => S.interests.has(p.activity))];
}
// One gradient per activity type for the photo-style header.
const HUES = { ski: 205, hike: 120, climb: 25, skate: 190, bike: 90, water: 195, parks: 300, arcade: 270, bowl: 340, sports: 35, events: 320, museum: 50 };
const hero = (p) => { const h = HUES[p.activity] ?? 200; return `background:linear-gradient(135deg,hsl(${h} 70% 82%),hsl(${h + 30} 60% 62%))`; };

function renderDiscover() {
  const cards = deck();
  if (!cards.length) return `
    <h1>Discover</h1>
    <p class="sub">That's everything nearby for now.</p>
    <button class="btn ghost" data-action="unskip">Show skipped ideas again</button>`;
  return `
    <h1>Try something new</h1>
    <p class="sub">Ideas outside your usual picks.</p>
    <div class="deck">
      ${cards.slice(0, 2).reverse().map((p, i, arr) => `
        <div class="swipe ${i < arr.length - 1 ? "behind" : ""}" ${i === arr.length - 1 ? 'id="top"' : ""}>
          <div class="hero" style="${hero(p)}">${act(p.activity).icon}</div>
          <div class="stamp like">SAVE</div><div class="stamp nope">SKIP</div>
          <div class="body">
            <div class="row"><div class="grow title">${act(p.activity).name}</div>${badge(busyNow(p))}</div>
            <div class="meta">${esc(p.name)} · ${esc(p.town)} · ${esc(p.price)}</div>
            <p class="pitch">${esc(p.pitch)}</p>
          </div>
        </div>`).join("")}
    </div>
    <div class="actions">
      <button class="round" data-action="skip" aria-label="Skip">✕<small>Skip</small></button>
      <button class="round" data-action="save" aria-label="Save">❤️<small>Save</small></button>
    </div>
    <p class="hint">Swipe right to save, left to skip</p>`;
}

function renderCommunity() {
  // Filter chips: only activities that have at least one group.
  const used = [...new Set(S.groups.map((g) => place(g.place).activity))];
  const list = S.groups.filter((g) =>
    S.placeFilter ? g.place === S.placeFilter : S.filter === "all" || place(g.place).activity === S.filter);
  return `
    <div class="row"><h1 class="grow">Groups going out</h1>
      <button class="btn small" data-action="newgroup">+ Start a group</button></div>
    <p class="sub">Find people to go with.</p>
    <div class="filters">
      ${S.placeFilter ? `<button class="fchip" aria-pressed="true" data-action="clearplace">📍 ${esc(place(S.placeFilter).name)} ✕</button>` : ""}
      <button class="fchip" data-action="filter" data-id="all" aria-pressed="${!S.placeFilter && S.filter === "all"}">All</button>
      ${used.map((id) => `<button class="fchip" data-action="filter" data-id="${id}" aria-pressed="${!S.placeFilter && S.filter === id}">${act(id).icon} ${act(id).name}</button>`).join("")}
    </div>
    ${list.length ? "" : `<p class="sub">No groups here yet. Start one!</p>`}
    ${list.map((g) => {
      const p = place(g.place), i = S.groups.indexOf(g);
      return `
      <div class="card">
        <div class="row">
          <span class="ico">${act(p.activity).icon}</span>
          <div class="grow">
            <div class="title">${esc(g.title)}</div>
            <div class="meta">${esc(p.name)} · ${esc(g.when)}</div>
            <div class="meta">${g.going} going · ${g.spots ? `${g.spots} spot${g.spots === 1 ? "" : "s"} left` : "Full"}</div>
          </div>
          <button class="btn small join ${g.joined ? "joined" : ""}" data-action="join" data-id="${i}"
            ${!g.joined && !g.spots ? "disabled" : ""}>${g.joined ? "Joined ✓" : g.spots ? "Join" : "Full"}</button>
        </div>
      </div>`;
    }).join("")}`;
}

// ---------- Sheets ----------
function openDetail(id) {
  const p = place(id), s = series(p), lv = level(s[NOW]);
  $("#sheet").innerHTML = `
    <div class="scrim" data-action="closesheet">
      <div class="sheet" role="dialog" aria-label="${esc(p.name)}">
        <div class="grab"></div>
        <button class="close" data-action="closesheet" aria-label="Close">✕</button>
        <div class="title" style="font-size:20px">${act(p.activity).icon} ${esc(p.name)}</div>
        <div class="meta">${act(p.activity).name} · ${esc(p.town)} · ${p.miles} mi</div>
        <h2>Busyness today <span class="badge ${lv.cls}" style="margin-left:6px">${lv.label} now</span></h2>
        <div class="chart" aria-label="Busyness by hour, 8 AM to 10 PM">
          ${s.map((v, i) => `<div class="bar ${level(v).bar} ${i === NOW ? "now" : ""}" style="height:${v}%" title="${h12(i + 8)} ${ampm(i + 8)}: ${level(v).label}"></div>`).join("")}
        </div>
        <div class="axis"><span>8a</span><span>11a</span><span>2p</span><span>5p</span><span>8p</span><span>10p</span></div>
        <dl class="info">
          <dt>Best time</dt><dd>${bestTime(p)}</dd>
          <dt>Conditions</dt><dd>${esc(p.conditions)}</dd>
          <dt>Price</dt><dd>${esc(p.price)}</dd>
        </dl>
        <div class="stack">
          <button class="btn" data-action="directions">Get directions</button>
          <button class="btn ghost" data-action="groupsat" data-id="${p.id}">See groups going</button>
        </div>
      </div>
    </div>`;
}

function openNewGroup() {
  const opts = (list) => list.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join("");
  $("#sheet").innerHTML = `
    <div class="scrim" data-action="closesheet">
      <form class="sheet" id="groupform" role="dialog" aria-label="Start a group">
        <div class="grab"></div>
        <button type="button" class="close" data-action="closesheet" aria-label="Close">✕</button>
        <div class="title" style="font-size:20px">Start a group</div>
        <label for="g-act">Activity</label>
        <select id="g-act">${opts(D.activities)}</select>
        <label for="g-place">Place</label>
        <select id="g-place"></select>
        <label for="g-day">Day</label>
        <select id="g-day">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<option>${d}</option>`).join("")}</select>
        <label for="g-time">Time</label>
        <input id="g-time" type="time" value="18:00" required>
        <div style="margin-top:18px"><button class="btn">Create group</button></div>
      </form>
    </div>`;
  // Only show places that match the chosen activity.
  const fill = () => { $("#g-place").innerHTML = opts(D.places.filter((p) => p.activity === $("#g-act").value)); };
  $("#g-act").onchange = fill;
  fill();
  $("#g-day").value = "Sat";
  $("#groupform").onsubmit = (e) => {
    e.preventDefault();
    const [h, m] = $("#g-time").value.split(":").map(Number);
    const a = act($("#g-act").value);
    S.groups.unshift({
      title: `${a.name} group`, place: $("#g-place").value,
      when: `${$("#g-day").value} ${h12(h)}${m ? ":" + String(m).padStart(2, "0") : ""} ${ampm(h)}`,
      going: 1, spots: 5, joined: true,
    });
    S.filter = "all"; S.placeFilter = null;
    closeSheet(); render(); toast("Group created. You're the first one in!");
  };
}
const closeSheet = () => { $("#sheet").innerHTML = ""; };

// ---------- Toast ----------
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ---------- Render ----------
function render() {
  const screens = { intro: renderIntro, home: renderHome, discover: renderDiscover, community: renderCommunity };
  $("#screen").innerHTML = screens[S.tab]();
  $("#tabs").hidden = S.tab === "intro";
  document.querySelectorAll("#tabs button").forEach((b) => b.toggleAttribute("aria-current", b.dataset.id === S.tab));
  if (S.tab === "discover") bindSwipe();
}
function goTab(tab) { S.tab = tab; render(); $("#screen").scrollTop = 0; }

// ---------- Discover: save/skip and swipe gesture ----------
function decide(save) {
  const top = $("#top"), p = deck()[0];
  if (!top || !p) return;
  top.style.transform = `translateX(${save ? 140 : -140}%) rotate(${save ? 20 : -20}deg)`;
  setTimeout(() => {
    if (save) { S.saved.unshift(p.id); toast(`Saved ${p.name}. Find it on Home.`); }
    else S.skipped.add(p.id);
    render();
  }, 200);
}
function bindSwipe() {
  const card = $("#top");
  if (!card) return;
  let x0 = null, dx = 0;
  card.onpointerdown = (e) => { x0 = e.clientX; dx = 0; card.classList.add("dragging"); card.setPointerCapture(e.pointerId); };
  card.onpointermove = (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 15}deg)`;
    card.querySelector(".like").style.opacity = Math.max(0, dx / 100);
    card.querySelector(".nope").style.opacity = Math.max(0, -dx / 100);
  };
  card.onpointerup = card.onpointercancel = () => {
    if (x0 === null) return;
    x0 = null; card.classList.remove("dragging");
    if (Math.abs(dx) > 90) decide(dx > 0);
    else if (Math.abs(dx) < 5) toast("Swipe right to save, left to skip");
    else { card.style.transform = ""; card.querySelectorAll(".stamp").forEach((s) => (s.style.opacity = 0)); }
  };
}

// ---------- One click handler for every tappable element ----------
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  // Taps inside a sheet shouldn't close it; only the scrim itself or the ✕ button.
  if (el.classList.contains("scrim") && e.target !== el) return;
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case "interest": S.interests.has(id) ? S.interests.delete(id) : S.interests.add(id); render(); break;
    case "start": goTab("home"); break;
    case "tab": goTab(id); break;
    case "reset": closeSheet(); S = freshState(); render(); toast("Demo reset. Hand it to the next person!"); break;
    case "detail": openDetail(id); break;
    case "closesheet": e.preventDefault(); closeSheet(); break;
    case "directions": toast("This would open Maps (not in the prototype)"); break;
    case "groupsat": S.placeFilter = id; closeSheet(); goTab("community"); break;
    case "save": decide(true); break;
    case "skip": decide(false); break;
    case "unskip": S.skipped.clear(); render(); break;
    case "filter": S.filter = id; S.placeFilter = null; render(); break;
    case "clearplace": S.placeFilter = null; render(); break;
    case "newgroup": openNewGroup(); break;
    case "join": {
      const g = S.groups[id];
      g.joined = !g.joined;
      g.going += g.joined ? 1 : -1;
      g.spots += g.joined ? -1 : 1;
      toast(g.joined ? `You're in! See you ${g.when}.` : "You left the group.");
      render();
      break;
    }
  }
});

// ---------- Start ----------
$("#logo").textContent = D.logoLetter;
$("#brand").textContent = D.appName;
S = freshState();
render();
</script>
</body>
